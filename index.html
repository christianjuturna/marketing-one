          <input type="file" id="hiddenFileInput" accept="image/*,video/*" multiple>
        </div>
        <div class="media-add-row">
          <button type="button" class="btn ghost small" id="addLinkBtn">+ Paste share link</button>
        </div>
        <div class="upload-status" id="uploadStatus"></div>
      </div>

      <div class="field">
        <label>Thumbnail (optional — cover image for video posts)</label>
        <div class="file-drop" id="thumbDrop">
          <input type="file" id="f_thumb" accept="image/*">
          Click to choose a thumbnail image
        </div>
        <div class="upload-status" id="thumbStatus"></div>
        ${draft.thumbnail_url ? `<div class="thumb-preview"><img src="${draft.thumbnail_url}"><span>Current thumbnail</span></div>` : ''}
      </div>

      <div class="field">
        <label>Caption</label>
        <textarea id="f_caption" placeholder="Write the caption exactly as it should post...">${escapeHtml(draft.caption||'')}</textarea>
      </div>

      <div class="field">
        <label>Hashtags</label>
        <input type="text" id="f_hashtags" placeholder="#filmmaking #bts #originpoint" value="${escapeHtml(draft.hashtags||'')}">
      </div>

      ${otherPlatforms.length ? `
      <div class="field">
        <label>Also post this to (reuses the same media — no re-upload)</label>
        <div class="crosspost-options">
          ${otherPlatforms.map(p=>{
            const linked = draft.group_id && state.posts.some(sp => sp.group_id === draft.group_id && sp.platform === p && sp.id !== draft.id);
            return `<label class="cp-check ${linked?'linked':''}">
              <input type="checkbox" class="cp-platform-check" value="${p}" ${linked?'checked disabled':''}>
              ${PLATFORM_META[p].label}${linked?' <span class="cp-linked-tag">linked</span>':''}
            </label>`;
          }).join('')}
        </div>
        <div class="cp-caption-mode" id="cpCaptionModeWrap" style="display:none;">
          <div class="seg" id="captionModeSeg">
            <button type="button" data-mode="same" class="active">Same caption everywhere</button>
            <button type="button" data-mode="custom">Custom caption per platform</button>
          </div>
          <div id="cpCaptionFields"></div>
        </div>
      </div>
      ` : ''}

      <div class="row2">
        <div class="field">
          <label>Scheduled date</label>
          <input type="date" id="f_date" value="${draft.scheduled_date||''}">
        </div>
        <div class="field">
          <label>Live post URL (once posted)</label>
          <input type="text" id="f_posturl" placeholder="https://instagram.com/p/..." value="${escapeHtml(draft.post_url||'')}">
        </div>
      </div>

      <div class="field">
        <label>Notes for whoever posts this</label>
        <textarea id="f_notes" placeholder="e.g. tag @client, post at 9am, use trending audio XYZ...">${escapeHtml(draft.notes||'')}</textarea>
      </div>

      <div class="modal-actions">
        <div>${!isNew ? '<button class="btn danger small" id="deleteBtn">Delete post</button>' : ''}</div>
        <div class="right">
          <button class="btn ghost small" id="cancelBtn">Cancel</button>
          <button class="btn small" id="saveBtn">Save post</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let mediaItems = (draft.media_items || []).map(it => Object.assign({}, it));
  let pendingThumbUrl = draft.thumbnail_url;

  function renderMediaList(){
    const wrap = $('#mediaList', overlay);
    if(mediaItems.length === 0){
      wrap.innerHTML = `<div style="font-size:12px;color:var(--text-dim);">No media added yet — upload a file or paste a link below.</div>`;
    } else {
      wrap.innerHTML = mediaItems.map((it, i) => {
        const thumb = it.type === 'link'
          ? '🔗'
          : (it.media_type === 'video' ? `<video src="${it.url}" muted></video>` : `<img src="${it.url}">`);
        const label = it.type === 'link' ? it.url : (it.file_name || 'uploaded file');
        return `
          <div class="media-item-row" data-idx="${i}">
            <span style="font-size:11px;color:var(--text-dim);width:14px;">${i+1}</span>
            <div class="mi-thumb">${thumb}</div>
            <div class="mi-label">${escapeHtml(label)}</div>
            <button type="button" class="mi-btn move-up" title="Move earlier" ${i===0?'disabled':''}>↑</button>
            <button type="button" class="mi-btn move-down" title="Move later" ${i===mediaItems.length-1?'disabled':''}>↓</button>
            <button type="button" class="mi-btn remove-item" title="Remove">✕</button>
          </div>
        `;
      }).join('');
    }
    $all('.remove-item', wrap).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.closest('.media-item-row').dataset.idx, 10);
        mediaItems.splice(idx, 1);
        renderMediaList();
      });
    });
    $all('.move-up', wrap).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.closest('.media-item-row').dataset.idx, 10);
        if(idx > 0){ [mediaItems[idx-1], mediaItems[idx]] = [mediaItems[idx], mediaItems[idx-1]]; renderMediaList(); }
      });
    });
    $all('.move-down', wrap).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.closest('.media-item-row').dataset.idx, 10);
        if(idx < mediaItems.length-1){ [mediaItems[idx+1], mediaItems[idx]] = [mediaItems[idx], mediaItems[idx+1]]; renderMediaList(); }
      });
    });
  }
  renderMediaList();

  $('.close-x', overlay).addEventListener('click', ()=> overlay.remove());
  $('#cancelBtn', overlay).addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });

  $('#addLinkBtn', overlay).addEventListener('click', ()=>{
    const link = prompt('Paste the share link (Frame.io, Drive, Dropbox, etc.) for this slide:');
    if(link && link.trim()){
      mediaItems.push({ type:'link', url: link.trim(), media_type:null, file_name:null });
      renderMediaList();
    }
  });

  async function handleFilesSelected(fileList){
    const files = Array.from(fileList || []);
    if(files.length === 0) return;
    const statusEl = $('#uploadStatus', overlay);
    let done = 0, failed = 0;
    for(const file of files){
      statusEl.textContent = `Uploading ${done + failed + 1} of ${files.length}… (${file.name})`;
      try{
        const [{ publicUrl }, dims] = await Promise.all([
          uploadToStorage(file, `${draft.company_id}/${draft.platform}`),
          getMediaDimensions(file)
        ]);
        const ratio = (dims && dims.width && dims.height) ? dims.width / dims.height : null;
        mediaItems.push({ type:'upload', url: publicUrl, media_type: guessTypeFromMime(file.type), file_name: file.name, ratio });
        renderMediaList();
        done++;
      }catch(err){
        console.error(err);
        failed++;
      }
    }
    statusEl.textContent = failed
      ? `Uploaded ${done} of ${files.length} — ${failed} failed, try those again.`
      : `Uploaded ${done} file${done===1?'':'s'}.`;
  }

  const dropzone = $('#mediaDropzone', overlay);
  const hiddenInput = $('#hiddenFileInput', overlay);
  dropzone.addEventListener('click', ()=> hiddenInput.click());
  hiddenInput.addEventListener('change', (e)=>{
    handleFilesSelected(e.target.files);
    e.target.value = '';
  });
  ['dragenter','dragover'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('drag-over');
    });
  });
  ['dragleave','dragend'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('drag-over');
    });
  });
  dropzone.addEventListener('drop', (e)=>{
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('drag-over');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      handleFilesSelected(e.dataTransfer.files);
    }
  });

  const thumbDrop = $('#thumbDrop', overlay);
  const thumbInput = $('#f_thumb', overlay);
  thumbDrop.addEventListener('click', ()=> thumbInput.click());
  ['dragenter','dragover'].forEach(evt=>{
    thumbDrop.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      thumbDrop.classList.add('drag-over');
    });
  });
  ['dragleave','dragend'].forEach(evt=>{
    thumbDrop.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      thumbDrop.classList.remove('drag-over');
    });
  });
  thumbDrop.addEventListener('drop', async (e)=>{
    e.preventDefault(); e.stopPropagation();
    thumbDrop.classList.remove('drag-over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) await handleThumbFile(file);
  });

  async function handleThumbFile(file){
    $('#thumbStatus', overlay).textContent = 'Uploading…';
    try{
      const { publicUrl } = await uploadToStorage(file, `${draft.company_id}/${draft.platform}/thumbnails`);
      pendingThumbUrl = publicUrl;
      $('#thumbStatus', overlay).textContent = 'Thumbnail uploaded: ' + file.name;
    }catch(err){
      console.error(err);
      $('#thumbStatus', overlay).textContent = 'Upload failed — try again.';
    }
  }

  thumbInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    await handleThumbFile(file);
  });

  let captionMode = 'same';
  const customCaptions = {};
  if(otherPlatforms.length){
    const cpWrap = $('#cpCaptionModeWrap', overlay);
    function checkedUnlockedPlatforms(){
      return $all('.cp-platform-check', overlay).filter(cb => cb.checked && !cb.disabled).map(cb => cb.value);
    }
    function renderCpCaptionFields(){
      const fieldsWrap = $('#cpCaptionFields', overlay);
      const checked = checkedUnlockedPlatforms();
      const anyChecked = checked.length > 0;
      cpWrap.style.display = anyChecked ? 'block' : 'none';
      if(captionMode !== 'custom' || !anyChecked){
        fieldsWrap.innerHTML = '';
        return;
      }
      fieldsWrap.innerHTML = checked.map(p => `
        <div class="field" style="margin-top:10px;">
          <label>${PLATFORM_META[p].label} caption</label>
          <textarea class="cp-caption-input" data-platform="${p}" placeholder="Caption for ${PLATFORM_META[p].label}...">${escapeHtml(customCaptions[p] != null ? customCaptions[p] : ($('#f_caption', overlay).value||''))}</textarea>
        </div>
      `).join('');
      $all('.cp-caption-input', fieldsWrap).forEach(ta=>{
        ta.addEventListener('input', ()=>{ customCaptions[ta.dataset.platform] = ta.value; });
      });
    }
    $all('.cp-platform-check', overlay).forEach(cb=>{
      cb.addEventListener('change', renderCpCaptionFields);
    });
    $all('#captionModeSeg button', overlay).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        captionMode = btn.dataset.mode;
        $all('#captionModeSeg button', overlay).forEach(b=>b.classList.toggle('active', b===btn));
        renderCpCaptionFields();
      });
    });
    renderCpCaptionFields();
  }

  if(!isNew){
    $('#deleteBtn', overlay).addEventListener('click', async ()=>{
      if(!confirm('Delete this post? This cannot be undone.')) return;
      try{
        await deletePostRemote(post.id);
        state.posts = state.posts.filter(p=>p.id!==post.id);
        overlay.remove();
        renderAll();
        showToast('Post deleted');
      }catch(err){ console.error(err); showToast('Failed to delete'); }
    });
  }

  $('#saveBtn', overlay).addEventListener('click', async ()=>{
    const mainCaption = $('#f_caption', overlay).value;
    const mainHashtags = $('#f_hashtags', overlay).value;
    const mainStatus = $('#f_status', overlay).value;
    const mainDate = $('#f_date', overlay).value || null;
    const mainNotes = $('#f_notes', overlay).value;

    const crossPlatforms = otherPlatforms.length
      ? $all('.cp-platform-check', overlay).filter(cb => cb.checked && !cb.disabled).map(cb => cb.value)
      : [];
    const groupId = (draft.group_id) || (crossPlatforms.length ? crypto.randomUUID() : null);

    const payload = {
      company_id: draft.company_id,
      platform: draft.platform,
      status: mainStatus,
      caption: mainCaption,
      hashtags: mainHashtags,
      media_items: mediaItems,
      thumbnail_url: pendingThumbUrl,
      post_url: $('#f_posturl', overlay).value,
      scheduled_date: mainDate,
      notes: mainNotes,
      group_id: groupId,
    };
    $('#saveBtn', overlay).disabled = true;
    $('#saveBtn', overlay).textContent = 'Saving…';
    try{
      if(isNew){
        const created = await createPost(payload);
        state.posts.unshift(created);
      } else {
        const updated = await updatePost(post.id, payload);
        const idx = state.posts.findIndex(p=>p.id===post.id);
        state.posts[idx] = updated;
      }

      if(crossPlatforms.length){
        for(const p of crossPlatforms){
          const siblingCaption = captionMode === 'custom' && customCaptions[p] != null ? customCaptions[p] : mainCaption;
          const siblingPayload = {
            company_id: draft.company_id,
            platform: p,
            status: mainStatus,
            caption: siblingCaption,
            hashtags: mainHashtags,
            media_items: mediaItems,
            thumbnail_url: pendingThumbUrl,
            post_url: '',
            scheduled_date: mainDate,
            notes: mainNotes,
            group_id: groupId,
          };
          try{
            const sib = await createPost(siblingPayload);
            state.posts.unshift(sib);
          }catch(err){ console.error(err); }
        }
      }

      overlay.remove();
      renderAll();
      showToast(crossPlatforms.length ? `Saved and cross-posted to ${crossPlatforms.length} more platform${crossPlatforms.length===1?'':'s'}` : 'Saved');
    }catch(err){
      console.error(err);
      $('#saveBtn', overlay).disabled = false;
      $('#saveBtn', overlay).textContent = 'Save post';
      showToast('Save failed — check connection');
    }
  });
}

/* ============ POSTING PREP TAB ============ */
function renderPrep(){
  const content = $('#content');
  const actionable = state.posts.filter(p => p.status === 'ready' || p.status === 'scheduled');
  const grouped = {};
  actionable.forEach(p=>{
    grouped[p.company_id] = grouped[p.company_id] || [];
    grouped[p.company_id].push(p);
  });

  let html = `
    <div class="toolbar-row">
      <div style="color:var(--text-dim);font-size:13px;max-width:640px;">
        Everything marked <b style="color:var(--text)">Ready</b> or <b style="color:var(--text)">Scheduled</b> shows up here as a grab-and-go kit: caption, hashtags, media, and thumbnail all in one place for whoever is posting.
      </div>
    </div>
  `;

  if(actionable.length === 0){
    html += `<div class="empty-state">Nothing queued to post yet. Mark a post “Ready” or “Scheduled” in Previsualize and it’ll show up here.</div>`;
    content.innerHTML = html;
    return;
  }

  COMPANIES.forEach(c=>{
    const posts = (grouped[c.id]||[]).slice().sort((a,b)=>{
      const da = a.scheduled_date || '9999-99-99', db = b.scheduled_date || '9999-99-99';
      return da.localeCompare(db);
    });
    if(posts.length===0) return;
    html += `<div class="section-heading" style="color:${c.color}">${c.name}</div><div class="prep-list">`;
    posts.forEach(p=>{
      const meta = PLATFORM_META[p.platform];
      const items = mediaItemsOf(p);
      const firstUpload = items.find(it => it.type === 'upload');
      const thumbSrc = p.thumbnail_url || (firstUpload ? firstUpload.url : '');
      const mediaButtons = items.map((it, i) => {
        if(it.type === 'upload'){
          return `<a class="btn ghost small" href="${it.url}" target="_blank" download>Media ${items.length>1 ? i+1 : ''}</a>`;
        }
        return `<a class="btn ghost small" href="${it.url}" target="_blank">Link ${items.length>1 ? i+1 : ''}</a>`;
      }).join('');
      html += `
        <div class="prep-row" data-id="${p.id}">
          ${thumbSrc ? `<img class="prep-thumb" src="${thumbSrc}">` : `<div class="prep-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;">no media</div>`}
          <div class="prep-main">
            <div class="prep-tags">
              <span class="chip" style="background:${c.color}22;color:${c.color}">${meta.label}</span>
              <span class="chip status-${p.status}">${STATUS_LABEL[p.status]}</span>
              ${items.length>1 ? `<span class="chip" style="background:#ffffff14;color:var(--text-dim)">${items.length} slides</span>` : ''}
              ${p.scheduled_date ? `<span class="chip" style="background:#ffffff14;color:var(--text-dim)">${fmtDate(p.scheduled_date)}</span>` : ''}
            </div>
            <div class="prep-caption">${escapeHtml(p.caption || '(no caption)')}</div>
          </div>
          <div class="prep-actions">
            <button class="btn ghost small copy-caption">Copy caption</button>
            <button class="btn ghost small copy-hashtags">Copy hashtags</button>
            ${mediaButtons}
            ${p.thumbnail_url ? `<a class="btn ghost small" href="${p.thumbnail_url}" target="_blank" download>Thumbnail</a>` : ''}
            <button class="btn small mark-posted">Mark posted</button>
            <button class="btn ghost small edit-row">Edit</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });

  content.innerHTML = html;

  $all('.prep-row', content).forEach(row=>{
    const id = row.dataset.id;
    const post = state.posts.find(p=>p.id===id);
    $('.copy-caption', row).addEventListener('click', ()=>{
      navigator.clipboard.writeText(post.caption||'').then(()=> showToast('Caption copied'));
    });
    $('.copy-hashtags', row).addEventListener('click', ()=>{
      navigator.clipboard.writeText(post.hashtags||'').then(()=> showToast('Hashtags copied'));
    });
    $('.edit-row', row).addEventListener('click', ()=> openEditor(id));
    $('.mark-posted', row).addEventListener('click', async ()=>{
      const url = prompt('Optional: paste the live post URL (or leave blank)') || '';
      try{
        const updated = await updatePost(id, { status:'posted', post_url: url });
        const idx = state.posts.findIndex(p=>p.id===id);
        state.posts[idx] = updated;
        renderAll();
        showToast('Marked as posted 🎉');
      }catch(err){ console.error(err); showToast('Failed to update'); }
    });
  });
}

/* ============ LIVE PAGE PREVIEW TAB ============ */
function upcomingPostsFor(companyId, platform){
  return state.posts.filter(p => p.company_id===companyId && p.platform===platform && (p.status==='ready' || p.status==='scheduled'));
}
function currentPostsFor(companyId, platform){
  return state.currentPosts.filter(p => p.company_id===companyId && p.platform===platform)
    .sort((a,b)=> (a.sort_order-b.sort_order) || (new Date(b.created_at)-new Date(a.created_at)));
}

function renderLivePreview(){
  const company = companyById(state.company);
  if(!state.platform || !company.platforms.includes(state.platform)){
    state.platform = company.platforms[0];
  }
  const meta = PLATFORM_META[state.platform];
  const content = $('#content');
  const isYt = meta.kind === 'yt';
  const isIg = meta.kind === 'ig';
  const igConfigured = isIg && !!(state.settings['instagram_access_token__'+company.id] && state.settings['instagram_ig_user_id__'+company.id]);

  content.innerHTML = `
    <div class="toolbar-row">
      <div class="platform-tabs">
        ${company.platforms.map(p => `
          <button class="platform-tab ${p===state.platform?'active':''}" data-platform="${p}">
            ${PLATFORM_META[p].label}
          </button>`).join('')}
      </div>
      ${isYt
        ? `<button class="btn ghost small" id="refreshYtBtn">↻ Refresh from YouTube</button>`
        : igConfigured
          ? `<button class="btn ghost small" id="refreshIgLiveBtn">↻ Refresh from Instagram</button>`
          : `<button class="btn small" id="addCurrentBtn">+ Add current post</button>`
      }
    </div>
    <div style="color:var(--text-dim);font-size:12.5px;margin-bottom:16px;max-width:640px;">
      This is what ${company.name}'s ${meta.label} page looks like today, with anything marked <b style="color:var(--text)">Ready</b> or <b style="color:var(--text)">Scheduled</b> dropped in at the top so you can see how it'll look once it's live.
    </div>
    <div id="liveArea"></div>
  `;

  $all('.platform-tab', content).forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.platform = btn.dataset.platform; renderLivePreview(); });
  });
  if(isYt){
    $('#refreshYtBtn').addEventListener('click', async ()=>{
      await loadYoutubeForCompany(state.company);
      renderLiveArea();
    });
  } else if(igConfigured){
    $('#refreshIgLiveBtn').addEventListener('click', async ()=>{
      await loadInstagramForCompany(state.company);
      renderLiveArea();
    });
  } else {
    $('#addCurrentBtn').addEventListener('click', ()=> openAddCurrentPostModal());
  }

  renderLiveArea();
  if(isYt && !state.ytCache[state.company]){
    loadYoutubeForCompany(state.company).then(renderLiveArea);
  }
  if(igConfigured && !state.igMediaCache[state.company]){
    loadInstagramForCompany(state.company).then(renderLiveArea);
  }
}

function renderLiveArea(){
  const area = $('#liveArea');
  if(!area) return;
  const company = companyById(state.company);
  const meta = PLATFORM_META[state.platform];
  const upcoming = upcomingPostsFor(state.company, state.platform);

  if(meta.kind === 'yt'){
    area.innerHTML = renderYtLive(company, upcoming);
  } else if(meta.kind === 'ig'){
    area.innerHTML = renderIgLive(company, upcoming);
  } else if(meta.kind === 'vert'){
    area.innerHTML = renderGridLive(company, upcoming, 'grid-vert', 'grid-vert-tile');
  } else if(meta.kind === 'li'){
    area.innerHTML = renderLiLive(company, upcoming);
  }
  bindLiveAreaEvents(area);
}

function bindLiveAreaEvents(area){
  $all('.js-open-post', area).forEach(el=>{
    el.addEventListener('click', ()=> openEditor(el.dataset.id));
  });
  $all('.js-remove-current', area).forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Remove this from the current-page preview?')) return;
      try{
        await deleteCurrentPostRemote(el.dataset.id);
        state.currentPosts = state.currentPosts.filter(p=>p.id!==el.dataset.id);
        renderLiveArea();
      }catch(err){ console.error(err); showToast('Failed to remove'); }
    });
  });
}

function profileHeaderHtml(company){
  return `
    <div class="profile-header">
      <div class="avatar-circ" style="background:${company.color}">${company.initials}</div>
      <div>
        <div class="profile-name">${company.name}</div>
        <div class="profile-handle">${company.handle}</div>
        <div class="profile-stats"><span><b>—</b> posts</span><span><b>—</b> followers</span></div>
      </div>
    </div>
  `;
}

function firstThumbOf(post){
  if(post.thumbnail_url) return { url: post.thumbnail_url, video: false };
  const items = mediaItemsOf(post);
  const first = items[0];
  if(!first) return null;
  if(first.type === 'link') return null;
  return { url: first.url, video: first.media_type === 'video' };
}

function renderGridLive(company, upcoming, gridClass, tileClass){
  const current = currentPostsFor(company.id, state.platform);
  const upcomingTiles = upcoming.map(p=>{
    const thumb = firstThumbOf(p);
    const inner = thumb ? (thumb.video ? `<video src="${thumb.url}" muted></video>` : `<img src="${thumb.url}">`) : `<div class="no-media-ph">+</div>`;
    return `<div class="${tileClass} js-open-post" data-id="${p.id}"><span class="upcoming-badge">Upcoming</span>${inner}<div class="tile-cap">${escapeHtml((p.caption||'').slice(0,60))}</div></div>`;
  }).join('');
  const currentTiles = current.map(p=>{
    return `<div class="${tileClass}" title="${escapeHtml(p.caption||'')}">
      ${p.thumbnail_url ? `<img src="${p.thumbnail_url}">` : `<div class="no-media-ph">🖼</div>`}
      <div class="tile-cap">${escapeHtml((p.caption||'').slice(0,60))}</div>
      <button type="button" class="mi-btn js-remove-current" data-id="${p.id}" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;border-radius:6px;z-index:7;">✕</button>
    </div>`;
  }).join('');
  const body = (upcomingTiles + currentTiles) || `<div class="empty-state" style="grid-column:1/-1">No posts yet — add a current post or mark one Ready/Scheduled in Previsualize.</div>`;
  return `<div class="live-wrap">${profileHeaderHtml(company)}<div class="${gridClass}">${body}</div></div>`;
}

function renderIgLive(company, upcoming){
  const igConfigured = !!(state.settings['instagram_access_token__'+company.id] && state.settings['instagram_ig_user_id__'+company.id]);
  const upcomingTiles = upcoming.map(p=>{
    const thumb = firstThumbOf(p);
    const inner = thumb ? (thumb.video ? `<video src="${thumb.url}" muted></video>` : `<img src="${thumb.url}">`) : `<div class="no-media-ph">+</div>`;
    return `<div class="grid3-tile js-open-post" data-id="${p.id}"><span class="upcoming-badge">Upcoming</span>${inner}<div class="tile-cap">${escapeHtml((p.caption||'').slice(0,60))}</div></div>`;
  }).join('');

  if(!igConfigured){
    // No live Instagram account connected yet — fall back to the manual "current post" workflow.
    const current = currentPostsFor(company.id, 'instagram');
    const currentTiles = current.map(p=>`
      <div class="grid3-tile" title="${escapeHtml(p.caption||'')}">
        ${p.thumbnail_url ? `<img src="${p.thumbnail_url}">` : `<div class="no-media-ph">🖼</div>`}
        <div class="tile-cap">${escapeHtml((p.caption||'').slice(0,60))}</div>
        <button type="button" class="mi-btn js-remove-current" data-id="${p.id}" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;border-radius:6px;z-index:7;">✕</button>
      </div>`).join('');
    const body = (upcomingTiles + currentTiles) || `<div class="empty-state" style="grid-column:1/-1">No posts yet — add a current post, or connect this account's Instagram API key in <a href="#" id="openSettingsFromLive">Settings</a> to show real posts here.</div>`;
    setTimeout(()=>{
      const btn = document.getElementById('openSettingsFromLive');
      if(btn) btn.addEventListener('click', (e)=>{ e.preventDefault(); openSettingsModal(); });
    }, 0);
    return `<div class="live-wrap">${profileHeaderHtml(company)}<div class="grid3">${body}</div></div>`;
  }

  const cache = state.igMediaCache[company.id];
  let liveTiles;
  if(!cache || cache.status === 'loading'){
    liveTiles = `<div class="config-note" style="grid-column:1/-1">Loading your Instagram posts…</div>`;
  } else if(cache.status === 'error'){
    liveTiles = `<div class="config-note" style="grid-column:1/-1">Couldn't load Instagram posts: ${escapeHtml(cache.error)}<br><button class="btn ghost small" id="openSettingsFromLive">Check Settings</button></div>`;
  } else {
    liveTiles = cache.media.map(m => `
      <div class="grid3-tile" title="${escapeHtml(m.caption||'')}">
        <a href="${m.permalink}" target="_blank" rel="noopener" style="display:block;width:100%;height:100%;">
          <img src="${m.thumb}">
        </a>
        <div class="tile-cap">${escapeHtml((m.caption||'').slice(0,60))}</div>
      </div>
    `).join('') || `<div class="empty-state" style="grid-column:1/-1">No posts found on that account yet.</div>`;
  }

  setTimeout(()=>{
    const btn = document.getElementById('openSettingsFromLive');
    if(btn) btn.addEventListener('click', openSettingsModal);
  }, 0);

  return `<div class="live-wrap">${profileHeaderHtml(company)}<div class="grid3">${upcomingTiles}${liveTiles}</div></div>`;
}

function renderYtLive(company, upcoming){
  const cache = state.ytCache[company.id];
  const upcomingRows = upcoming.map(p=>{
    const thumb = firstThumbOf(p);
    const inner = thumb ? (thumb.video ? `<video src="${thumb.url}" muted></video>` : `<img src="${thumb.url}">`) : `<div class="no-media-ph">+</div>`;
    return `
      <div class="yt-live-row js-open-post" data-id="${p.id}">
        <div class="yt-live-thumb"><span class="upcoming-badge">Upcoming</span>${inner}</div>
        <div><div class="yt-live-title">${escapeHtml(p.caption || '(untitled video)')}</div><div class="yt-live-sub">${company.handle} · ${p.scheduled_date ? fmtDate(p.scheduled_date) : 'unscheduled'}</div></div>
      </div>
    `;
  }).join('');

  let liveSection;
  if(!cache || cache.status === 'unconfigured'){
    liveSection = `<div class="config-note">Connect your YouTube channel to see your real, currently-live videos here.<br><button class="btn ghost small" id="openSettingsFromLive">Open Settings</button></div>`;
  } else if(cache.status === 'loading'){
    liveSection = `<div class="config-note">Loading your channel's videos…</div>`;
  } else if(cache.status === 'error'){
    liveSection = `<div class="config-note">Couldn't load YouTube videos: ${escapeHtml(cache.error)}<br><button class="btn ghost small" id="openSettingsFromLive">Check Settings</button></div>`;
  } else {
    liveSection = cache.videos.map(v => `
      <div class="yt-live-row">
        <div class="yt-live-thumb"><img src="${v.thumb}"></div>
        <div><div class="yt-live-title">${escapeHtml(v.title)}</div><div class="yt-live-sub">${company.handle} · ${new Date(v.publishedAt).toLocaleDateString()}</div></div>
      </div>
    `).join('') || `<div class="empty-state">No videos found on that channel yet.</div>`;
  }

  setTimeout(()=>{
    const btn = document.getElementById('openSettingsFromLive');
    if(btn) btn.addEventListener('click', openSettingsModal);
  }, 0);

  return `<div class="live-wrap wide">${profileHeaderHtml(company)}${upcomingRows}${liveSection}</div>`;
}

function renderLiLive(company, upcoming){
  const current = currentPostsFor(company.id, state.platform);
  const upcomingCards = upcoming.map(p => `<div class="js-open-post" data-id="${p.id}" style="position:relative;margin-bottom:12px;"><span class="upcoming-badge" style="top:8px;left:auto;right:8px;">Upcoming</span>${renderLiCard(p, company)}</div>`).join('');
  const currentCards = current.map(p => `
    <div class="li-live-compact">
      ${p.thumbnail_url ? `<img src="${p.thumbnail_url}">` : ''}
      <div class="cap">${escapeHtml(p.caption||'')}</div>
      <button type="button" class="mi-btn js-remove-current" data-id="${p.id}" style="margin-left:auto;">✕</button>
    </div>
  `).join('');
  const body = (upcomingCards + currentCards) || `<div class="empty-state">No posts yet — add a current post or mark one Ready/Scheduled in Previsualize.</div>`;
  return `<div class="live-wrap">${profileHeaderHtml(company)}${body}</div>`;
}

function openAddCurrentPostModal(){
  const company = companyById(state.company);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:460px;">
      <button class="close-x">&times;</button>
      <h2>Add current ${PLATFORM_META[state.platform].label} post</h2>
      <div class="sub">${company.name} — this represents something already live today, for reference only.</div>
      <div class="field">
        <label>Thumbnail</label>
        <div class="add-current-row">
          <button type="button" class="btn ghost small" id="curUploadBtn">+ Upload image</button>
          <button type="button" class="btn ghost small" id="curLinkBtn">+ Paste image URL</button>
        </div>
        <input type="file" id="curHiddenFile" accept="image/*" style="display:none">
        <div class="upload-status" id="curUploadStatus"></div>
      </div>
      <div class="field">
        <label>Caption / title</label>
        <textarea id="curCaption" placeholder="What this post says..."></textarea>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button class="btn ghost small" id="curCancelBtn">Cancel</button>
          <button class="btn small" id="curSaveBtn">Add</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  let thumbUrl = '';

  $('.close-x', overlay).addEventListener('click', ()=> overlay.remove());
  $('#curCancelBtn', overlay).addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });

  $('#curUploadBtn', overlay).addEventListener('click', ()=> $('#curHiddenFile', overlay).click());
  $('#curLinkBtn', overlay).addEventListener('click', ()=>{
    const link = prompt('Paste an image URL:');
    if(link && link.trim()){ thumbUrl = link.trim(); $('#curUploadStatus', overlay).textContent = 'Using pasted URL'; }
  });
  $('#curHiddenFile', overlay).addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    $('#curUploadStatus', overlay).textContent = 'Uploading…';
    try{
      const { publicUrl } = await uploadToStorage(file, `${state.company}/${state.platform}/current`);
      thumbUrl = publicUrl;
      $('#curUploadStatus', overlay).textContent = 'Uploaded: ' + file.name;
    }catch(err){ console.error(err); $('#curUploadStatus', overlay).textContent = 'Upload failed — try again.'; }
  });

  $('#curSaveBtn', overlay).addEventListener('click', async ()=>{
    try{
      const created = await createCurrentPost({
        company_id: state.company,
        platform: state.platform,
        thumbnail_url: thumbUrl || null,
        caption: $('#curCaption', overlay).value,
        source: 'manual',
      });
      state.currentPosts.unshift(created);
      overlay.remove();
      renderLiveArea();
      showToast('Added');
    }catch(err){ console.error(err); showToast('Failed to add'); }
  });
}

/* ============ SETTINGS MODAL ============ */

      <button class="close-x">&times;</button>
      <h2>Settings</h2>
      <div class="sub">Shared across your whole team — saved to Supabase.</div>
      <div class="section-heading" style="margin-top:0;">YouTube (live data)</div>
      <div class="field">
        <label>YouTube Data API key</label>
        <input type="text" id="s_ytkey" placeholder="AIza..." value="${escapeHtml(state.settings.youtube_api_key||'')}">

        <div class="field">
          <label>${c.name} — Channel ID</label>

          <label>${c.name} — Instagram Business Account ID</label>
          <input type="text" id="s_iguid_${c.id}" placeholder="e.g. 17841438623355817" value="${escapeHtml(state.settings['instagram_ig_user_id__'+c.id]||'')}">
        </div>
      `).join('')}
      <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.5;">
        Generate a per-account access token in Meta for Developers (App → Instagram → API setup with Instagram login → Generate token). Each token is tied to one Instagram Business Account.
      </div>

      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button class="btn ghost small" id="setCancelBtn">Close</button>
          <button class="btn small" id="setSaveBtn">Save settings</button>
        </div>
      </div>
    </div>
  `;

    try{

        state.settings[key] = value;
      }
      state.ytCache = {};
      overlay.remove();
      showToast('Settings saved');
      renderAll();
    }catch(err){
      console.error(err);
      $('#setSaveBtn', overlay).disabled = false;
      $('#setSaveBtn', overlay).textContent = 'Save settings';
      showToast('Failed to save settings');
    }
  });
}

async function ensureMetricsLoaded(companyId){

/* ---- Analytics helpers: range filtering, growth math, auto-takeaways ---- */
const REPORT_RANGES = [
  { key:'7',   label:'7D' },
  { key:'30',  label:'30D' },
  { key:'90',  label:'90D' },
  { key:'all', label:'All' },
];

function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}

function rangeLabelText(rangeKey){
  const found = REPORT_RANGES.find(r=>r.key===rangeKey);
  return rangeKey === 'all' ? 'all time' : `last ${rangeKey} days`;
}

function filterRowsByRange(rowsAsc, rangeKey){
  if(rangeKey === 'all') return rowsAsc;
  const cutoff = daysAgoISO(Number(rangeKey));
  return rowsAsc.filter(r => r.period_date >= cutoff);
}

// rowsAsc: rows for one platform, sorted ascending by period_date.
// Finds the best "before" snapshot for the range window and compares it to the latest one.
function computeGrowth(rowsAsc, rangeKey){
  if(!rowsAsc || rowsAsc.length === 0) return null;
  const latest = rowsAsc[rowsAsc.length-1];
  let baseline;
  if(rangeKey === 'all'){
    baseline = rowsAsc[0];
  } else {
    const cutoff = daysAgoISO(Number(rangeKey));
    const before = rowsAsc.filter(r => r.period_date <= cutoff);
    baseline = before.length ? before[before.length-1] : rowsAsc[0];
  }
  if(!baseline || baseline.id === latest.id){
    return { latest, baseline: null };
  }
  const change = (latest.followers||0) - (baseline.followers||0);
  const pct = baseline.followers ? (change / baseline.followers * 100) : null;
  const daysSpan = Math.max(1, Math.round((new Date(latest.period_date) - new Date(baseline.period_date)) / 86400000));
  return { latest, baseline, change, pct, daysSpan };
}

function growthTileHtml(growth, rangeKey){
  const rangeShort = rangeKey === 'all' ? 'all time' : rangeKey+'D';
  if(!growth || !growth.baseline){
    return `<div class="stat-tile"><div class="label">Change (${rangeShort})</div><div class="value" style="font-size:13px;font-weight:600;color:var(--text-dim);">Not enough data yet</div></div>`;
  }
  const up = growth.change > 0, down = growth.change < 0;
  const color = up ? '#22c55e' : (down ? '#ef4444' : 'var(--text-dim)');
  const arrow = up ? '▲' : (down ? '▼' : '→');
  const pctStr = growth.pct != null ? ` (${growth.pct>=0?'+':''}${growth.pct.toFixed(1)}%)` : '';
  return `<div class="stat-tile"><div class="label">Change (${rangeShort})</div><div class="value" style="color:${color};font-size:20px;">${arrow} ${fmtNum(Math.abs(growth.change))}${pctStr}</div></div>`;
}

function describeGrowth(label, growth){
  if(!growth) return null;
  if(!growth.baseline) return { text:`${label}: only one snapshot logged so far — keep pulling stats regularly (weekly is a good cadence) to start seeing real trends here.`, kind:'warn' };
  const dir = growth.change > 0 ? 'grew' : (growth.change < 0 ? 'declined' : 'held flat');
  const kind = growth.change > 0 ? 'up' : (growth.change < 0 ? 'down' : 'neutral');
  const pctStr = growth.pct != null ? ` (${growth.pct>=0?'+':''}${growth.pct.toFixed(1)}%)` : '';
  return { text:`${label} ${dir} by ${fmtNum(Math.abs(growth.change))} followers${pctStr} over the last ${growth.daysSpan} day${growth.daysSpan===1?'':'s'}.`, kind };
}

function freshnessFlag(label, rowsAsc){
  if(!rowsAsc.length) return null;
  const latest = rowsAsc[rowsAsc.length-1];
  const daysSince = Math.round((Date.now() - new Date(latest.period_date)) / 86400000);
  if(daysSince >= 7) return { text:`${label}'s last snapshot is ${daysSince} days old — pull fresh numbers before presenting this report.`, kind:'warn' };
  return null;
}

function buildTakeaways(hasYt, hasIg, ytAsc, igAsc, rangeKey){
  const items = [];
  const ytGrowth = (hasYt && ytAsc.length) ? computeGrowth(ytAsc, rangeKey) : null;
  const igGrowth = (hasIg && igAsc.length) ? computeGrowth(igAsc, rangeKey) : null;

  const ytLine = describeGrowth('YouTube', ytGrowth);
  const igLine = describeGrowth('Instagram', igGrowth);
  if(ytLine) items.push(ytLine);
  if(igLine) items.push(igLine);

  if(ytGrowth && ytGrowth.baseline && igGrowth && igGrowth.baseline && ytGrowth.pct != null && igGrowth.pct != null){
    if(Math.abs(ytGrowth.pct - igGrowth.pct) > 1){
      const faster = ytGrowth.pct > igGrowth.pct ? 'YouTube' : 'Instagram';
      items.push({ text:`${faster} is growing faster in percentage terms this period — worth leaning into whatever content strategy is working there.`, kind:'up' });
    } else {
      items.push({ text:`YouTube and Instagram are growing at a similar pace this period.`, kind:'neutral' });
    }
  }

  if(hasYt){ const f = freshnessFlag('YouTube', ytAsc); if(f) items.push(f); }
  if(hasIg){ const f = freshnessFlag('Instagram', igAsc); if(f) items.push(f); }

  if(items.length === 0){
    items.push({ text:'No analytics logged yet for this company — pull live stats or log manual numbers to start building a trend history.', kind:'warn' });
  }
  return items;
}

function takeawaysHtml(items){
  return `<ul class="insight-list">${items.map(it => `<li class="insight-item ${it.kind||''}"><span class="dot"></span><span>${escapeHtml(it.text)}</span></li>`).join('')}</ul>`;
}

function buildMeetingSummaryText(company, ytAsc, igAsc, rangeKey, takeaways){
  const latestYt = ytAsc[ytAsc.length-1];
  const latestIg = igAsc[igAsc.length-1];
  let out = `${company.name} — Marketing Report (${rangeLabelText(rangeKey)})\n`;
  out += `Generated ${new Date().toLocaleDateString()}\n\n`;
  if(latestYt){
    out += `YouTube: ${fmtNum(latestYt.followers)} subscribers, ${fmtNum(latestYt.views)} total views (as of ${latestYt.period_date})\n`;
  }
  if(latestIg){
    out += `Instagram: ${fmtNum(latestIg.followers)} followers (as of ${latestIg.period_date})\n`;
  }
  out += `\nTakeaways:\n`;
  takeaways.forEach(t => out += `- ${t.text}\n`);
  return out;
}

/* ---- Content-level detail: real videos/posts with thumbnails + performance ---- */
function buildContentTakeaways(hasYt, hasIg, ytCache, igMediaCache){
  const items = [];
  if(hasYt && ytCache && ytCache.status === 'ok' && ytCache.videos.length){
    const top = ytCache.videos.slice().sort((a,b)=>(b.views||0)-(a.views||0))[0];
    if(top && top.views != null){
      items.push({ text:`Top YouTube video right now: "${top.title}" with ${fmtNum(top.views)} views.`, kind:'up' });
    }
  }
  if(hasIg && igMediaCache && igMediaCache.status === 'ok' && igMediaCache.media.length){
    const top = igMediaCache.media.slice().sort((a,b)=>(b.likes||0)-(a.likes||0))[0];
    if(top && top.likes != null){
      items.push({ text:`Top Instagram post right now: "${(top.caption||'(no caption)').slice(0,60)}" with ${fmtNum(top.likes)} likes.`, kind:'up' });
    }
  }
  return items;
}

function contentSectionHtml({ title, refreshId, unconfigured, configNote, cache, items, renderCard }){
  let body;
  if(unconfigured){
    body = `<div class="sub">${configNote}</div>`;
  } else if(!cache || cache.status === 'loading'){
    body = `<div class="sub">Loading recent content…</div>`;
  } else if(cache.status === 'error'){
    body = `<div class="sub" style="color:#ef4444;">Couldn't load content: ${escapeHtml(cache.error)}</div>`;
  } else if(items.length === 0){
    body = `<div class="sub">No posts found yet.</div>`;
  } else {
    body = `<div class="content-grid">${items.map((it,i)=>renderCard(it, i===0)).join('')}</div>`;
  }
  return `
    <div class="report-panel">
      <div class="toolbar-row" style="margin-bottom:2px;">
        <h3 style="margin:0;">${title}</h3>
        ${(!unconfigured && refreshId) ? `<button class="btn ghost small" id="${refreshId}">↻ Refresh content</button>` : ''}
      </div>
      ${body}
    </div>
  `;
}

// Manual thumbnail overrides for live content cards (keyed by platform + the platform's own
// content id, so they survive refreshes). Stored in the same shared `settings` key/value store
// used elsewhere in the app.
function contentThumbKey(platform, itemId){
  return 'content_thumb__' + platform + '__' + itemId;
}

function thumbEditControlsHtml(overrideKey, hasOverride){
  return `
    <button type="button" class="thumb-edit-btn" data-override-key="${overrideKey}" title="Upload a custom thumbnail">📷</button>
    ${hasOverride ? `<button type="button" class="thumb-clear-btn" data-override-key="${overrideKey}" title="Remove custom thumbnail — revert to the live one">↺</button>` : ''}
  `;
}

function renderContentPerformance(company, hasYt, hasIg, igConfigured){

        <div class="content-card ${isTop && v.views!=null ?'top':''}">

          </div>

  if(hasIg){

    const items = (cache && cache.status==='ok') ? cache.media.slice().sort((a,b)=>(b.likes||0)-(a.likes||0)) : [];
    out += contentSectionHtml({
      title: 'Recent Instagram posts',

      cache, items,

              <span>💬 <b>${fmtNum(m.comments)}</b></span>
            </div>
          </div>
        </div>`;
      },

  return out;

function renderReportsModule(){
  const content = $('#content');
  const company = companyById(state.company);
  content.innerHTML = `<div class="report-panel"><div class="sub">Loading analytics for ${escapeHtml(company.name)}…</div></div>`;
  const igConfigured = company.platforms.includes('instagram') && state.settings['instagram_access_token__'+company.id] && state.settings['instagram_ig_user_id__'+company.id];
  const tasks = [ensureMetricsLoaded(state.company)];
  if(company.platforms.includes('youtube') && state.settings.youtube_api_key && state.settings['youtube_channel__'+company.id] && !state.ytCache[state.company]){
    tasks.push(loadYoutubeForCompany(state.company));
  }
  if(igConfigured && !state.igMediaCache[state.company]){
    tasks.push(loadInstagramForCompany(state.company));
  }
  Promise.all(tasks).then(()=>{
    if(state.module === 'reports' && state.company === company.id) paintReportsModule();
  });
}

    });
  });
  if(thumbOverrideInput) thumbOverrideInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    thumbOverrideInput.value = '';
    if(!file || !pendingThumbOverrideKey) return;
    const key = pendingThumbOverrideKey;
    try{
      showToast('Uploading thumbnail…');
      const { publicUrl } = await uploadToStorage(file, 'content-thumbnails');
      await saveSetting(key, publicUrl);
      state.settings[key] = publicUrl;
      showToast('Custom thumbnail saved');
      paintReportsModule();
    }catch(err){ console.error(err); showToast('Failed to upload thumbnail'); }
  });

  $('#addIgMetricBtn').addEventListener('click', ()=> openMetricEntryModal(company.id, 'instagram'));
  $all('.del-metric').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      try{
        await deleteMetricRemote(id);
        state.metrics[company.id] = state.metrics[company.id].filter(r=>r.id!==id);
        paintReportsModule();
      }catch(err){ console.error(err); showToast('Failed to delete'); }
    });
  });
}

function openMetricEntryModal(companyId, platform){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const today = new Date().toISOString().slice(0,10);
  overlay.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <button class="close-x">&times;</button>
      <h2>Log ${platform==='youtube'?'YouTube':'Instagram'} numbers</h2>
      <div class="sub">${escapeHtml(companyById(companyId).name)} — a manual snapshot for a given date.</div>
      <div class="field"><label>Date</label><input type="date" id="m_date" value="${today}"></div>
      <div class="field"><label>Followers</label><input type="text" id="m_followers" placeholder="e.g. 12500"></div>
      <div class="field"><label>Reach / Views (this period)</label><input type="text" id="m_views" placeholder="e.g. 45000"></div>
      <div class="field"><label>Engagement rate % (optional)</label><input type="text" id="m_eng" placeholder="e.g. 4.2"></div>
      <div class="field"><label>Notes (optional)</label><textarea id="m_notes"></textarea></div>
      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button class="btn ghost small" id="mCancelBtn">Cancel</button>
          <button class="btn small" id="mSaveBtn">Save</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  $('.close-x', overlay).addEventListener('click', ()=> overlay.remove());
  $('#mCancelBtn', overlay).addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  $('#mSaveBtn', overlay).addEventListener('click', async ()=>{
    try{
      const created = await createMetric({
        company_id: companyId,
        platform,
        period_date: $('#m_date', overlay).value || today,
        followers: parseInt($('#m_followers', overlay).value) || null,
        views: parseInt($('#m_views', overlay).value) || null,
        engagement: parseFloat($('#m_eng', overlay).value) || null,
        source: 'manual',
        notes: $('#m_notes', overlay).value,
      });
      state.metrics[companyId] = state.metrics[companyId] || [];
      state.metrics[companyId].push(created);
      overlay.remove();
      showToast('Logged');
      paintReportsModule();
    }catch(err){ console.error(err); showToast('Failed to save'); }
  });
}

/* ============ CRM MODULE (Origin Point leads / sales) ============ */
async function ensureLeadsLoaded(){
  if(state.leadsLoaded) return;
  try{ state.leads = await fetchLeads(); }
  catch(err){ console.error(err); state.leads = []; }
  state.leadsLoaded = true;
}

function renderCrmModule(){
  const content = $('#content');
  content.innerHTML = `<div class="report-panel"><div class="sub">Loading leads…</div></div>`;
  ensureLeadsLoaded().then(()=>{ if(state.module==='crm') paintCrmModule(); });
}

function paintCrmModule(){
  const content = $('#content');
  const leads = state.leads;
  const totalValue = leads.filter(l=>l.stage==='won').reduce((s,l)=> s + (Number(l.value)||0), 0);
  content.innerHTML = `
    <div class="toolbar-row">
      <div style="font-weight:700;font-size:15px;">Origin Point CRM — leads &amp; sales from LinkedIn / social</div>
      <button class="btn small" id="addLeadBtn">+ Add lead</button>
    </div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="label">Total leads</div><div class="value">${leads.length}</div></div>
      <div class="stat-tile"><div class="label">Won</div><div class="value">${leads.filter(l=>l.stage==='won').length}</div></div>
      <div class="stat-tile"><div class="label">Won value</div><div class="value">$${fmtNum(totalValue)}</div></div>
    </div>
    <div class="kanban" id="kanbanBoard">
      ${LEAD_STAGES.map(stage=>`
        <div class="kanban-col" data-stage="${stage}">
          <h4>${LEAD_STAGE_LABEL[stage]} <span>${leads.filter(l=>l.stage===stage).length}</span></h4>
          <div class="kanban-cards" data-stage="${stage}">
            ${leads.filter(l=>l.stage===stage).map(l=>`
              <div class="lead-card" draggable="true" data-id="${l.id}">
                <div class="lname">${escapeHtml(l.name)}</div>
                <div class="lco">${escapeHtml(l.company_name||'')}</div>
                <div class="lmeta"><span>${escapeHtml(l.source||'LinkedIn')}</span>${l.value ? `<span class="lval">$${fmtNum(l.value)}</span>` : ''}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;

  $('#addLeadBtn').addEventListener('click', ()=> openLeadModal());
  $all('.lead-card', content).forEach(card=>{
    card.addEventListener('click', ()=> openLeadModal(card.dataset.id));
    card.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', card.dataset.id);
      setTimeout(()=> card.style.opacity = '0.4', 0);
    });
    card.addEventListener('dragend', ()=>{ card.style.opacity = '1'; });
  });
  $all('.kanban-col', content).forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async (e)=>{
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const newStage = col.dataset.stage;
      const lead = state.leads.find(l=>l.id===id);
      if(!lead || lead.stage === newStage) return;
      lead.stage = newStage;
      paintCrmModule();
      try{ await updateLead(id, { stage:newStage }); }
      catch(err){ console.error(err); showToast('Failed to move lead'); }
    });
  });
}

function openLeadModal(id){
  const lead = id ? state.leads.find(l=>l.id===id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:460px;">
      <button class="close-x">&times;</button>
      <h2>${lead ? 'Edit lead' : 'Add lead'}</h2>
      <div class="sub">Origin Point — LinkedIn / social lead tracking.</div>
      <div class="field"><label>Name</label><input type="text" id="l_name" value="${escapeHtml(lead ? lead.name : '')}"></div>
      <div class="field"><label>Company</label><input type="text" id="l_company" value="${escapeHtml(lead ? lead.company_name||'' : '')}"></div>
      <div class="field"><label>Email</label><input type="text" id="l_email" value="${escapeHtml(lead ? lead.email||'' : '')}"></div>
      <div class="field"><label>Phone</label><input type="text" id="l_phone" value="${escapeHtml(lead ? lead.phone||'' : '')}"></div>
      <div class="field"><label>Source</label><input type="text" id="l_source" value="${escapeHtml(lead ? lead.source||'LinkedIn' : 'LinkedIn')}"></div>
      <div class="field"><label>Stage</label>
        <select id="l_stage">${LEAD_STAGES.map(s=>`<option value="${s}" ${lead && lead.stage===s ? 'selected':''}>${LEAD_STAGE_LABEL[s]}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Deal value ($, optional)</label><input type="text" id="l_value" value="${lead && lead.value != null ? lead.value : ''}"></div>
      <div class="field"><label>Notes</label><textarea id="l_notes">${escapeHtml(lead ? lead.notes||'' : '')}</textarea></div>
      ${lead ? `
        <hr class="section-divider">
        <div class="field">
          <label>Conversations &amp; activity</label>
          <div class="activity-log" id="activityLog"><div class="sub">Loading…</div></div>
          <div class="activity-form">
            <select id="act_type">${ACTIVITY_TYPES.map(t=>`<option value="${t}">${ACTIVITY_LABEL[t]}</option>`).join('')}</select>
            <textarea id="act_content" placeholder="What happened / was said..."></textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn small" id="act_logBtn">Log it</button>
          </div>
        </div>
      ` : ''}
      <div class="modal-actions">
        <div>${lead ? '<button class="btn danger small" id="lDeleteBtn">Delete</button>' : ''}</div>
        <div class="right">
          <button class="btn ghost small" id="lCancelBtn">Cancel</button>
          <button class="btn small" id="lSaveBtn">${lead ? 'Save' : 'Add lead'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  $('.close-x', overlay).addEventListener('click', ()=> overlay.remove());
  $('#lCancelBtn', overlay).addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });

  if(lead){
    loadAndRenderActivity(overlay, lead.id);
    $('#act_logBtn', overlay).addEventListener('click', async ()=>{
      const content = $('#act_content', overlay).value.trim();
      if(!content){ showToast('Write something first'); return; }
      const type = $('#act_type', overlay).value;
      const btn = $('#act_logBtn', overlay);
      btn.disabled = true;
      try{
        const created = await createLeadActivity({ lead_id: lead.id, type, content });
        state.leadActivities[lead.id] = state.leadActivities[lead.id] || [];
        state.leadActivities[lead.id].unshift(created);
        $('#act_content', overlay).value = '';
        renderActivityLog(overlay, lead.id);
        showToast('Logged');
      }catch(err){ console.error(err); showToast('Failed to log'); }
      finally{ btn.disabled = false; }
    });
  }

  const delBtn = $('#lDeleteBtn', overlay);
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    try{
      await deleteLeadRemote(lead.id);
      state.leads = state.leads.filter(l=>l.id!==lead.id);
      overlay.remove();
      paintCrmModule();
      showToast('Deleted');
    }catch(err){ console.error(err); showToast('Failed to delete'); }
  });

  $('#lSaveBtn', overlay).addEventListener('click', async ()=>{
    const payload = {
      name: $('#l_name', overlay).value.trim(),
      company_name: $('#l_company', overlay).value.trim(),
      email: $('#l_email', overlay).value.trim(),
      phone: $('#l_phone', overlay).value.trim(),
      source: $('#l_source', overlay).value.trim() || 'LinkedIn',
      stage: $('#l_stage', overlay).value,
      value: parseFloat($('#l_value', overlay).value) || null,
      notes: $('#l_notes', overlay).value,
    };
    if(!payload.name){ showToast('Name is required'); return; }
    try{
      if(lead){
        const updated = await updateLead(lead.id, payload);
        const idx = state.leads.findIndex(l=>l.id===lead.id);
        state.leads[idx] = updated;
      } else {
        payload.company_id = 'origin_point';
        const created = await createLead(payload);
        state.leads.unshift(created);
      }
      overlay.remove();
      paintCrmModule();
      showToast('Saved');
    }catch(err){ console.error(err); showToast('Failed to save'); }
  });
}

async function loadAndRenderActivity(overlay, leadId){
  if(!state.leadActivities[leadId]){
    try{ state.leadActivities[leadId] = await fetchLeadActivities(leadId); }
    catch(err){ console.error(err); state.leadActivities[leadId] = []; }
  }
  if(document.body.contains(overlay)) renderActivityLog(overlay, leadId);
}

function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

function renderActivityLog(overlay, leadId){
  const log = $('#activityLog', overlay);
  if(!log) return;
  const rows = state.leadActivities[leadId] || [];
  log.innerHTML = rows.length === 0
    ? '<div class="sub">No conversations logged yet.</div>'
    : rows.map(r=>`
      <div class="activity-row">
        <span class="activity-type-badge">${ACTIVITY_LABEL[r.type]||r.type}</span>
        <div class="activity-body">
          <div class="activity-content">${escapeHtml(r.content)}</div>
          <div class="activity-meta">
            <span class="activity-date">${fmtDateTime(r.created_at)}</span>
            <button type="button" class="activity-del" data-id="${r.id}">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
  $all('.activity-del', log).forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      try{
        await deleteLeadActivityRemote(id);
        state.leadActivities[leadId] = state.leadActivities[leadId].filter(r=>r.id!==id);
        renderActivityLog(overlay, leadId);
      }catch(err){ console.error(err); showToast('Failed to delete'); }
    });
  });
}

/* ============ CALL SHEET MODULE (newsletters / blogs) ============ */
async function ensureCallsheetLoaded(companyId){
  if(state.callsheetLoaded[companyId]) return;
  try{ state.callsheet[companyId] = await fetchCallsheet(companyId); }
  catch(err){ console.error(err); state.callsheet[companyId] = []; }
  state.callsheetLoaded[companyId] = true;
}

function renderCallsheetModule(){
  const content = $('#content');
  const company = companyById(state.company);
  content.innerHTML = `<div class="report-panel"><div class="sub">Loading Call Sheet…</div></div>`;
  ensureCallsheetLoaded(company.id).then(()=>{
    if(state.module==='callsheet' && state.company===company.id) paintCallsheetModule();
  });
}

function paintCallsheetModule(){
  const content = $('#content');
  const company = companyById(state.company);
  const items = state.callsheet[company.id] || [];
  content.innerHTML = `
    <div class="toolbar-row">
      <div style="font-weight:700;font-size:15px;">Call Sheet — ${escapeHtml(company.name)} newsletters &amp; blogs</div>
      <button class="btn small" id="addCsBtn">+ New newsletter / blog</button>
    </div>
    <div class="sub" style="margin-bottom:16px;">Plan and preview content here, then copy it into whatever email/CMS system actually sends it.</div>
    ${items.length === 0 ? '<div class="report-panel"><div class="sub">Nothing planned yet.</div></div>' : `
      <div class="cs-grid">
        ${items.map(it=>`
          <div class="cs-card" data-id="${it.id}">
            <span class="cs-type-badge">${it.type==='blog'?'Blog':'Newsletter'}</span>
            <div class="cs-title">${escapeHtml(it.title || 'Untitled')}</div>
            ${it.subject_line ? `<div class="cs-subject">${escapeHtml(it.subject_line)}</div>` : ''}
            <div class="cs-meta"><span class="cs-status">${CS_STATUS_LABEL[it.status]||it.status}</span><span>${it.scheduled_date ? fmtDate(it.scheduled_date) : ''}</span></div>
          </div>
        `).join('')}
      </div>
    `}
  `;
  $('#addCsBtn').addEventListener('click', ()=> openCallsheetModal(company.id));
  $all('.cs-card', content).forEach(card=>{
    card.addEventListener('click', ()=> openCallsheetModal(company.id, card.dataset.id));
  });
}

function openCallsheetModal(companyId, id){
  const item = id ? (state.callsheet[companyId]||[]).find(i=>i.id===id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <button class="close-x">&times;</button>
      <h2>${item ? 'Edit' : 'New'} newsletter / blog</h2>
      <div class="sub">${escapeHtml(companyById(companyId).name)} — plan and preview, then copy out when it's ready.</div>
      <div class="field"><label>Type</label>
        <div class="seg">
          <button type="button" class="cs-type-btn ${(!item || item.type==='newsletter')?'active':''}" data-type="newsletter">Newsletter</button>
          <button type="button" class="cs-type-btn ${item && item.type==='blog'?'active':''}" data-type="blog">Blog</button>
        </div>
      </div>
      <div class="field"><label>Title</label><input type="text" id="cs_title" value="${escapeHtml(item ? item.title||'' : '')}"></div>
      <div class="field" id="cs_subject_field"><label>Subject line (newsletter)</label><input type="text" id="cs_subject" value="${escapeHtml(item ? item.subject_line||'' : '')}"></div>
      <div class="field"><label>Content</label><textarea id="cs_content" style="min-height:180px;">${escapeHtml(item ? item.content||'' : '')}</textarea></div>
      <div class="field"><label>Status</label>
        <select id="cs_status">${CS_STATUS_LIST.map(s=>`<option value="${s}" ${item && item.status===s ? 'selected':''}>${CS_STATUS_LABEL[s]}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Scheduled date (optional)</label><input type="date" id="cs_date" value="${item && item.scheduled_date ? item.scheduled_date : ''}"></div>
      <div class="field"><label>Notes</label><textarea id="cs_notes">${escapeHtml(item ? item.notes||'' : '')}</textarea></div>
      <div class="modal-actions">
        <div>${item ? '<button class="btn danger small" id="csDeleteBtn">Delete</button>' : ''}</div>
        <div class="right">
          <button class="btn ghost small" id="csCopyBtn">Copy for sending</button>
          <button class="btn ghost small" id="csCancelBtn">Cancel</button>
          <button class="btn small" id="csSaveBtn">Save</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  let currentType = item ? (item.type||'newsletter') : 'newsletter';
  const syncSubjectVisibility = ()=>{ $('#cs_subject_field', overlay).style.display = currentType==='newsletter' ? '' : 'none'; };
  syncSubjectVisibility();

  $all('.cs-type-btn', overlay).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentType = btn.dataset.type;
      $all('.cs-type-btn', overlay).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      syncSubjectVisibility();
    });
  });

  $('.close-x', overlay).addEventListener('click', ()=> overlay.remove());
  $('#csCancelBtn', overlay).addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });

  $('#csCopyBtn', overlay).addEventListener('click', async ()=>{
    const title = $('#cs_title', overlay).value.trim();
    const subject = $('#cs_subject', overlay).value.trim();
    const body = $('#cs_content', overlay).value;
    const text = (currentType==='newsletter' && subject ? `Subject: ${subject}\n\n` : '') + (title ? title+'\n\n' : '') + body;
    try{ await navigator.clipboard.writeText(text); showToast('Copied — paste into your email/CMS tool'); }
    catch(err){ console.error(err); showToast('Could not copy — select and copy manually'); }
  });

  const delBtn = $('#csDeleteBtn', overlay);
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    try{
      await deleteCallsheetItemRemote(item.id);
      state.callsheet[companyId] = (state.callsheet[companyId]||[]).filter(i=>i.id!==item.id);
      overlay.remove();
      paintCallsheetModule();
      showToast('Deleted');
    }catch(err){ console.error(err); showToast('Failed to delete'); }
  });

  $('#csSaveBtn', overlay).addEventListener('click', async ()=>{
    const payload = {
      type: currentType,
      title: $('#cs_title', overlay).value.trim(),
      subject_line: $('#cs_subject', overlay).value.trim(),
      content: $('#cs_content', overlay).value,
      status: $('#cs_status', overlay).value,
      scheduled_date: $('#cs_date', overlay).value || null,
      notes: $('#cs_notes', overlay).value,
    };
    try{
      if(item){
        const updated = await updateCallsheetItem(item.id, payload);
        const list = state.callsheet[companyId];
        list[list.findIndex(i=>i.id===item.id)] = updated;
      } else {
        payload.company_id = companyId;
        const created = await createCallsheetItem(payload);
        state.callsheet[companyId] = state.callsheet[companyId] || [];
        state.callsheet[companyId].unshift(created);
      }
      overlay.remove();
      paintCallsheetModule();
      showToast('Saved');
    }catch(err){ console.error(err); showToast('Failed to save'); }
  });
}

init();
</script>
