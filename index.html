<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing One</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e2230;
    --border:#2a2f3d;
    --text:#e8eaf0;
    --text-dim:#9aa1b2;
    --accent:#6366f1;
    --op:#2563eb;
    --bs:#ea580c;
    --bt1:#0d9488;
    --radius:14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);min-height:100vh;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#333849;border-radius:8px;}

  /* ---------- App shell ---------- */
  .app-header{
    position:sticky;top:0;z-index:50;
    background:rgba(15,17,21,0.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 20px 0 20px;
  }
  .app-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .app-title{font-size:18px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
  .app-title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .sync-pill{font-size:11px;color:var(--text-dim);border:1px solid var(--border);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;}
  .sync-pill.ok .dotstat{background:#22c55e;}
  .sync-pill.err .dotstat{background:#ef4444;}
  .dotstat{width:6px;height:6px;border-radius:50%;background:#eab308;}

  .company-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .company-tab{
    padding:9px 16px;border-radius:10px 10px 0 0;border:1px solid var(--border);border-bottom:none;
    background:var(--panel);color:var(--text-dim);font-weight:600;font-size:13.5px;
    display:flex;align-items:center;gap:8px;
  }
  .company-tab .sw{width:8px;height:8px;border-radius:50%;}
  .company-tab.active{background:var(--panel-2);color:var(--text);}
  .company-tab.active[data-company="origin_point"]{box-shadow: inset 0 3px 0 var(--op);}
  .company-tab.active[data-company="b_story"]{box-shadow: inset 0 3px 0 var(--bs);}
  .company-tab.active[data-company="back_to_one"]{box-shadow: inset 0 3px 0 var(--bt1);}

  .main-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .main-tab{padding:10px 2px 12px 2px;font-size:14px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .main-tab.active{color:var(--text);border-bottom-color:var(--accent);}

  /* ---------- App shell (sidebar + main area) ---------- */
  .app-shell{display:flex;align-items:flex-start;}

  /* ---------- Marketing One module switcher (now a vertical sidebar, flush left) ---------- */
  .sidebar{display:flex;flex-direction:column;gap:5px;flex-shrink:0;width:220px;padding:20px 12px 40px 20px;position:sticky;top:var(--header-h, 90px);}
  .module-tab{padding:10px 14px;border-radius:10px;border:1px solid transparent;background:none;color:var(--text-dim);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;width:100%;text-align:left;}
  .module-tab:hover{background:var(--panel);}
  .module-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .main-area{flex:1;min-width:0;}

  /* ---------- Calendar module ---------- */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-month-label{font-size:16px;font-weight:800;min-width:170px;text-align:center;}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);}
  .cal-legend-item{display:flex;align-items:center;gap:6px;}
  .cal-legend-item .sw{width:8px;height:8px;border-radius:50%;}
  .cal-grid{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
  .cal-weekday{padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:5px;min-height:112px;}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.out-month{background:rgba(255,255,255,0.015);}
  .cal-cell.out-month .cal-daynum{opacity:0.4;}
  .cal-cell.today{background:rgba(99,102,241,0.08);}
  .cal-cell.today .cal-daynum{color:var(--accent);font-weight:800;}
  .cal-daynum{font-size:12px;color:var(--text-dim);font-weight:700;}
  .cal-chips{display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .cal-chip{display:flex;gap:6px;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:3px 5px;cursor:pointer;transition:border-color .15s ease;}
  .cal-chip:hover{border-color:var(--accent);}
  .cal-chip-thumb{position:relative;width:22px;height:22px;border-radius:5px;overflow:hidden;background:#000;flex-shrink:0;}
  .cal-chip-thumb img,.cal-chip-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .cal-chip-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
  .cal-chip-dot{position:absolute;bottom:-1px;right:-1px;width:6px;height:6px;border-radius:50%;border:1px solid var(--panel-2);}
  .cal-chip-text{display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0;}
  .cal-chip-cap{font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px;}
  .cal-more{font-size:10.5px;color:var(--text-dim);padding:2px 4px;}
  .mini-status{display:inline-block;padding:1px 6px;border-radius:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;width:fit-content;}
  .cal-unsched-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .cal-unsched-card{cursor:grab;transition:border-color .15s ease;}
  .cal-unsched-card:hover{border-color:var(--accent);}
  .cal-chip{cursor:grab;}
  .cal-chip.dragging, .cal-unsched-card.dragging{opacity:0.4;}
  .cal-cell.drag-over{outline:2px dashed var(--accent);outline-offset:-4px;background:rgba(99,102,241,0.12);}

  /* ---------- Reports module ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .stat-tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat-tile .label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;font-weight:700;margin-bottom:6px;}
  .stat-tile .value{font-size:24px;font-weight:800;}
  .stat-tile .delta{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .stat-tile .delta.up{color:#22c55e;}
  .stat-tile .delta.down{color:#ef4444;}
  .report-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
  .report-panel h3{margin:0 0 4px 0;font-size:15px;}
  .report-panel .sub{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
  .chart-wrap{background:var(--panel-2);border-radius:10px;padding:10px;margin-top:10px;}
  .metric-log-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-dim);}
  .metric-log-row:last-child{border-bottom:none;}
  .range-tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:9px;padding:3px;}
  .range-tab{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--text-dim);}
  .range-tab.active{background:var(--accent);color:#fff;}
  .takeaway-panel{background:linear-gradient(180deg, rgba(99,102,241,0.08), rgba(99,102,241,0.02));border:1px solid rgba(99,102,241,0.35);}
  .insight-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .insight-item{display:flex;gap:10px;font-size:13px;line-height:1.5;align-items:flex-start;}
  .insight-item .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--accent);}
  .insight-item.up .dot{background:#22c55e;}
  .insight-item.down .dot{background:#ef4444;}
  .insight-item.warn .dot{background:#f59e0b;}
  .content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:12px;}
  .content-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .content-card .thumb-wrap{position:relative;width:100%;background:#000;overflow:hidden;}
  .content-card .thumb-wrap.thumb-16x9{aspect-ratio:16/9;}
  .content-card .thumb-wrap.thumb-1x1{aspect-ratio:1/1;}
  .content-card .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .content-card.top .thumb-wrap::after{content:'🏆 Top';position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.72);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;}
  .thumb-edit-btn, .thumb-clear-btn{position:absolute;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;border:1px solid rgba(255,255,255,0.25);z-index:5;}
  .thumb-edit-btn{right:6px;}
  .thumb-clear-btn{right:38px;}
  .thumb-edit-btn:hover, .thumb-clear-btn:hover{background:rgba(0,0,0,0.85);}
  .content-card .cc-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .content-card .cc-title{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);}
  .content-card .cc-date{font-size:11px;color:var(--text-dim);}
  .content-card .cc-stats{display:flex;gap:10px;font-size:11.5px;color:var(--text-dim);margin-top:auto;flex-wrap:wrap;padding-top:4px;}
  .content-card .cc-stats b{color:var(--text);}

  /* ---------- CRM module ---------- */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  .kanban-col{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:120px;}
  .kanban-col h4{margin:0 0 10px 0;font-size:12.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-dim);display:flex;justify-content:space-between;}
  .kanban-col.dragover{outline:2px dashed var(--accent);outline-offset:-4px;}
  .lead-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:grab;}
  .lead-card:active{cursor:grabbing;}
  .lead-card .lname{font-weight:700;font-size:13.5px;margin-bottom:2px;}
  .lead-card .lco{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
  .lead-card .lmeta{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;}
  .lead-card .lval{color:#22c55e;font-weight:700;}

  /* ---------- Lead activity / conversation log ---------- */
  .activity-log{max-height:220px;overflow-y:auto;margin-bottom:10px;}
  .activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .activity-row:last-child{border-bottom:none;}
  .activity-type-badge{flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:3px 8px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);height:fit-content;}
  .activity-body{flex:1;}
  .activity-content{font-size:12.5px;white-space:pre-wrap;line-height:1.4;}
  .activity-meta{display:flex;justify-content:space-between;align-items:center;margin-top:3px;}
  .activity-date{font-size:10.5px;color:var(--text-dim);}
  .activity-del{background:none;border:none;color:var(--text-dim);font-size:11px;padding:0;}
  .activity-del:hover{color:#ef4444;}
  .activity-form{display:flex;flex-direction:column;gap:8px;}
  .activity-form select{width:140px !important;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:12px;}
  .activity-form textarea{width:100%;min-height:44px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:12.5px;resize:vertical;}
  .section-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

  /* ---------- Call Sheet module ---------- */
  .cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .cs-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;}
  .cs-card:hover{border-color:var(--accent);}
  .cs-type-badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:2px 8px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);margin-bottom:8px;}
  .cs-title{font-weight:700;font-size:14px;margin-bottom:4px;}
  .cs-subject{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .cs-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-dim);}
  .cs-status{padding:2px 8px;border-radius:20px;background:var(--panel-2);font-weight:700;}

  .content{max-width:1180px;margin:0;padding:22px 24px 80px 24px;}

  /* ---------- Platform sub-tabs ---------- */
  .toolbar-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .platform-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .platform-tab{
    padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .platform-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .status-filters{display:flex;gap:6px;flex-wrap:wrap;}
  .status-pill{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text-dim);}
  .status-pill.active{background:var(--panel-2);color:var(--text);border-color:#3a4053;}

  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:#7f1d1d;}
  .btn.small{padding:6px 11px;font-size:12px;border-radius:8px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius);}

  .status-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:0.04em;padding:4px 8px;border-radius:6px;text-transform:uppercase;z-index:5;}
  .status-idea{background:#3f3f46;color:#e4e4e7;}
  .status-draft{background:#78350f;color:#fde68a;}
  .status-ready{background:#065f46;color:#a7f3d0;}
  .status-scheduled{background:#1e3a8a;color:#bfdbfe;}
  .status-posted{background:#4c1d95;color:#ddd6fe;}

  .card-wrap{position:relative;cursor:grab;transition:transform .15s ease, opacity .15s ease;}
  .card-wrap:hover{transform:translateY(-2px);}
  .card-wrap.dragging{opacity:0.35;cursor:grabbing;}
  .card-wrap .drag-handle{position:absolute;top:10px;left:10px;z-index:6;background:rgba(0,0,0,0.55);color:#fff;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:-1px;cursor:grab;}
  .card-meta-line{margin-top:8px;font-size:11.5px;color:var(--text-dim);display:flex;justify-content:space-between;}

  /* ---------- Instagram mockup ---------- */
  .ig-card{background:#000;border:1px solid #262626;border-radius:10px;overflow:hidden;color:#fafafa;font-size:13px;}
  .ig-header{display:flex;align-items:center;gap:9px;padding:9px 11px;}
  .avatar-circ{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}
  .ig-handle{font-weight:600;font-size:13px;}
  .ig-more{margin-left:auto;color:#aaa;}
  .ig-media{width:100%;aspect-ratio:1/1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .ig-media img,.ig-media video{width:100%;height:100%;object-fit:cover;}
  .ig-actions{display:flex;gap:12px;padding:9px 11px 2px 11px;font-size:19px;}
  .ig-actions .spacer{flex:1;}
  .ig-likes{padding:2px 11px;font-weight:600;font-size:12.5px;}
  .ig-caption{padding:4px 11px 12px 11px;line-height:1.4;}
  .ig-caption b{margin-right:5px;}
  .hashtags{color:#4fa8ff;}

  /* ---------- YouTube mockup ---------- */
  .yt-card{background:transparent;color:var(--text);font-size:13px;}
  .yt-thumb{width:100%;aspect-ratio:16/9;background:#22262f;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
  .yt-thumb img,.yt-thumb video{width:100%;height:100%;object-fit:cover;}
  .yt-duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.8);color:#fff;font-size:10.5px;padding:1px 5px;border-radius:4px;font-weight:600;}
  .yt-meta{display:flex;gap:10px;padding-top:10px;}
  .yt-title{font-weight:700;font-size:14px;line-height:1.3;margin-bottom:3px;}
  .yt-sub{color:var(--text-dim);font-size:12px;}

  /* ---------- LinkedIn mockup ---------- */
  .li-card{background:#1b1f27;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
  .li-header{display:flex;gap:10px;padding:12px 12px 6px 12px;align-items:flex-start;}
  .li-name{font-weight:700;font-size:13.5px;}
  .li-headline{color:var(--text-dim);font-size:11.5px;}
  .li-time{color:var(--text-dim);font-size:11px;}
  .li-text{padding:2px 12px 10px 12px;line-height:1.45;white-space:pre-wrap;}
  .li-media{width:100%;aspect-ratio:1.5/1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .li-media img,.li-media video{width:100%;height:100%;object-fit:cover;}
  .li-actions{display:flex;gap:16px;padding:9px 12px;color:var(--text-dim);font-size:12px;font-weight:600;border-top:1px solid var(--border);margin-top:8px;}

  /* ---------- Vertical (TikTok / Shorts) mockup ---------- */
  .vert-card{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:9/16;color:#fff;}
  .vert-media{position:absolute;inset:0;background:linear-gradient(160deg,#1a1a1a,#000);}
  .vert-media img,.vert-media video{width:100%;height:100%;object-fit:cover;}
  .vert-overlay{position:absolute;left:0;right:0;bottom:0;padding:14px 52px 16px 12px;background:linear-gradient(0deg,rgba(0,0,0,0.75),rgba(0,0,0,0));}
  .vert-handle{font-weight:700;font-size:13px;margin-bottom:4px;}
  .vert-caption{font-size:12.5px;line-height:1.35;max-height:54px;overflow:hidden;}
  .vert-music{font-size:11px;margin-top:6px;color:#ddd;}
  .vert-actions{position:absolute;right:8px;bottom:70px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:22px;}
  .vert-actions span{font-size:10px;display:block;margin-top:2px;}
  .vert-top-badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;background:rgba(255,255,255,0.15);padding:3px 7px;border-radius:6px;}

  .no-media-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#666;font-size:12px;width:100%;height:100%;padding:8px;text-align:center;}
  .no-media-ph .plus{font-size:26px;}

  /* ---------- Carousel controls ---------- */
  .media-slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
  .media-slide.active{display:flex;}
  .media-slide img,.media-slide video{width:100%;height:100%;object-fit:cover;}
  .car-nav{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border:none;z-index:6;line-height:1;padding:0;}
  .car-nav.prev{left:6px;}

/* ---- YouTube Data API (real, live channel videos) ---- */
async function fetchYoutubeVideos(channelId, apiKey){
  const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${encodeURIComponent(channelId)}&key=${encodeURIComponent(apiKey)}`);
  const chJson = await chRes.json();
  if(!chRes.ok) throw new Error(chJson.error && chJson.error.message || 'YouTube channel lookup failed');
  const uploadsPlaylist = chJson.items && chJson.items[0] && chJson.items[0].contentDetails.relatedPlaylists.uploads;
  if(!uploadsPlaylist) throw new Error('No channel found for that Channel ID');
  const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=12&playlistId=${encodeURIComponent(uploadsPlaylist)}&key=${encodeURIComponent(apiKey)}`);
  const plJson = await plRes.json();
  if(!plRes.ok) throw new Error(plJson.error && plJson.error.message || 'YouTube video list failed');
  const videos = (plJson.items || []).map(it => ({
    id: it.snippet.resourceId.videoId,
    title: it.snippet.title,
    thumb: (it.snippet.thumbnails.medium || it.snippet.thumbnails.default || {}).url,
    publishedAt: it.snippet.publishedAt,
    url: 'https://www.youtube.com/watch?v=' + it.snippet.resourceId.videoId,
    views: null, likes: null, comments: null,
  }));

  // Enrich with per-video performance stats (views/likes/comments) in one batched call.
  const ids = videos.map(v=>v.id).filter(Boolean).join(',');
  if(ids){
    try{
      const statsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${encodeURIComponent(ids)}&key=${encodeURIComponent(apiKey)}`);
      const statsJson = await statsRes.json();
      if(statsRes.ok){
        const byId = {};
        (statsJson.items || []).forEach(it => { byId[it.id] = it.statistics || {}; });
        videos.forEach(v => {
          const s = byId[v.id];
          if(s){
            v.views = Number(s.viewCount || 0);
            v.likes = Number(s.likeCount || 0);
            v.comments = Number(s.commentCount || 0);
          }
        });
      }
    }catch(err){ console.error('YouTube per-video stats failed', err); }
  }
  return videos;
}

async function fetchYoutubeChannelStats(channelId, apiKey){

  const json = await res.json();
  if(!res.ok) throw new Error(json.error && json.error.message || 'YouTube stats lookup failed');
  const item = json.items && json.items[0];
  if(!item) throw new Error('No channel found for that Channel ID');
  return {
    subscribers: Number(item.statistics.subscriberCount || 0),
    views: Number(item.statistics.viewCount || 0),
    videoCount: Number(item.statistics.videoCount || 0),
  };
}

    method:'POST',
    headers: sbHeaders({ 'Content-Type':'application/json', 'Prefer':'return=representation' }),
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('Create failed: ' + await res.text());
  const rows = await res.json();
  return rows[0];
}

  if(!res.ok) throw new Error('Delete failed: ' + await res.text());
}

async function loadYoutubeForCompany(companyId){
  const apiKey = state.settings.youtube_api_key;
  const channelId = state.settings['youtube_channel__' + companyId];
  if(!apiKey || !channelId){
    state.ytCache[companyId] = { status:'unconfigured' };
    return;
  }
  state.ytCache[companyId] = { status:'loading' };
  try{
    const videos = await fetchYoutubeVideos(channelId, apiKey);
    state.ytCache[companyId] = { status:'ok', videos, loadedAt: Date.now() };
  }catch(err){
    console.error(err);
    state.ytCache[companyId] = { status:'error', error: err.message };
  }
}

/* ---- Instagram Graph API (real, live account media) ---- */
async function fetchInstagramMedia(igUserId, accessToken){
  const res = await fetch(`https://graph.instagram.com/v21.0/${encodeURIComponent(igUserId)}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp,like_count,comments_count&limit=12&access_token=${encodeURIComponent(accessToken)}`);
  const json = await res.json();
  if(!res.ok) throw new Error(json.error && json.error.message || 'Instagram media lookup failed');
  return (json.data || []).map(it => ({
    id: it.id,
    caption: it.caption || '',
    mediaType: it.media_type,
    thumb: it.media_type === 'VIDEO' ? (it.thumbnail_url || it.media_url) : it.media_url,
    permalink: it.permalink,
    timestamp: it.timestamp,
    likes: it.like_count != null ? Number(it.like_count) : null,
    comments: it.comments_count != null ? Number(it.comments_count) : null,
  }));
}

async function loadInstagramForCompany(companyId){
  const accessToken = state.settings['instagram_access_token__' + companyId];
  const igUserId = state.settings['instagram_ig_user_id__' + companyId];
  if(!accessToken || !igUserId){
    state.igMediaCache[companyId] = { status:'unconfigured' };
    return;
  }
  state.igMediaCache[companyId] = { status:'loading' };
  try{
    const media = await fetchInstagramMedia(igUserId, accessToken);
    state.igMediaCache[companyId] = { status:'ok', media, loadedAt: Date.now() };
  }catch(err){
    console.error(err);
    state.igMediaCache[companyId] = { status:'error', error: err.message };
  }
}

/* ============ UTIL ============ */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function companyById(id){ return COMPANIES.find(c => c.id === id); }
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function isVideoType(mediaType){ return mediaType === 'video'; }
function guessTypeFromMime(mime){
  if(!mime) return 'image';
  return mime.startsWith('video') ? 'video' : 'image';
}
function fmtNum(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString();
}

// Minimal dependency-free line chart drawn directly on a <canvas> — good enough for
// "easy to read visuals" without pulling in a charting library.
function drawLineChart(canvas, points, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = 160 * 2;
  ctx.clearRect(0,0,w,h);
  ctx.scale(1,1);
  if(!points || points.length === 0){
    ctx.fillStyle = '#9aa1b2';
    ctx.font = '24px sans-serif';
    ctx.fillText('No data yet', 20, h/2);
    return;
  }
  const pad = 30;
  const vals = points.map(p=>p.v);
  const min = Math.min(...vals, 0);
  const max = Math.max(...vals, 1);
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const xy = (i,v)=> [pad + i*stepX, h - pad - ((v - min)/range) * (h - pad*2)];

  ctx.strokeStyle = opts.color || '#6366f1';
  ctx.lineWidth = 3;
  ctx.beginPath();
  points.forEach((p,i)=>{
    const [x,y] = xy(i,p.v);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  ctx.fillStyle = opts.color || '#6366f1';
  points.forEach((p,i)=>{
    const [x,y] = xy(i,p.v);
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#9aa1b2';
  ctx.font = '20px sans-serif';
  points.forEach((p,i)=>{
    if(points.length > 8 && i % Math.ceil(points.length/8) !== 0) return;
    const [x] = xy(i,p.v);
    ctx.fillText(p.label || '', x-14, h-6);
  });
}

// Reads the real pixel dimensions of a file locally (before/while it uploads) so cards
// can auto-fit portrait/square/landscape media instead of always forcing a square crop.
function getMediaDimensions(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (result)=>{
      if(done) return;
      done = true;
      URL.revokeObjectURL(url);
      resolve(result);
    };
    const timeout = setTimeout(()=> finish(null), 4000);
    if((file.type||'').startsWith('video')){
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = ()=>{ clearTimeout(timeout); finish({ width:v.videoWidth, height:v.videoHeight }); };
      v.onerror = ()=>{ clearTimeout(timeout); finish(null); };
      v.src = url;
    } else {
      const img = new Image();
      img.onload = ()=>{ clearTimeout(timeout); finish({ width:img.naturalWidth, height:img.naturalHeight }); };
      img.onerror = ()=>{ clearTimeout(timeout); finish(null); };
      img.src = url;
    }
  });
}

/* ============ INIT ============ */
// The sidebar is sticky under the header; since the header's height is now fixed
// (title row + company tabs only), we measure it once and keep it in sync on resize
// so the sidebar sticks right below it instead of overlapping.
function syncHeaderHeightVar(){
  const header = document.querySelector('.app-header');
  if(header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
}

async function init(){
  renderCompanyTabs();
  bindTopLevelEvents();
  syncHeaderHeightVar();
  window.addEventListener('resize', syncHeaderHeightVar);
  try{
    const [posts, settings, currentPosts] = await Promise.all([fetchPosts(), fetchSettings(), fetchCurrentPosts()]);
    state.posts = posts;
    state.settings = settings;
    state.currentPosts = currentPosts;
    state.loaded = true;
    setSyncStatus(true, 'Synced with Supabase');
  }catch(e){
    console.error(e);
    setSyncStatus(false, 'Offline — check Supabase connection');
  }
  renderAll();
}

function setSyncStatus(ok, text){
  const pill = $('#syncPill');
  pill.classList.toggle('ok', ok);
  pill.classList.toggle('err', !ok);
  $('#syncText').textContent = text;
}

function renderCompanyTabs(){
  const wrap = $('#companyTabs');
  wrap.innerHTML = COMPANIES.map(c => `
    <button class="company-tab ${c.id===state.company?'active':''}" data-company="${c.id}">
      <span class="sw" style="background:${c.color}"></span>${c.name}
    </button>
  `).join('');
  $all('.company-tab', wrap).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.company = btn.dataset.company;
      state.platform = null;
      renderCompanyTabs();
      renderAll();
    });
  });
}

function bindTopLevelEvents(){
  $all('.main-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $all('.main-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.mainTab = btn.dataset.tab;
      renderAll();
    });
  });
  $all('.module-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $all('.module-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.module = btn.dataset.module;
      state.platform = null;
      updateChromeVisibility();
      renderAll();
    });
  });
  $('#settingsBtn').addEventListener('click', openSettingsModal);
  updateChromeVisibility();
}

// The company-tabs row and the Previz/Live/Prep sub-tabs only make sense for the
// Content Command Center and (for company tabs) Reports/Call Sheet modules — CRM is
// scoped to Origin Point only, so we hide company switching there.
function updateChromeVisibility(){
  const mainTabs = $('#mainTabs');
  const companyTabs = $('#companyTabs');
  mainTabs.style.display = (state.module === 'content') ? '' : 'none';
  // Calendar is a combined, all-companies view (like CRM), so the per-company tabs
  // don't apply there either.
  companyTabs.style.display = (state.module === 'crm' || state.module === 'calendar') ? 'none' : '';
}

function renderAll(){
  if(state.module === 'calendar'){ renderCalendarModule(); return; }
  if(state.module === 'reports'){ renderReportsModule(); return; }
  if(state.module === 'crm'){ renderCrmModule(); return; }
  if(state.module === 'callsheet'){ renderCallsheetModule(); return; }
  if(state.mainTab === 'previz') renderPreviz();
  else if(state.mainTab === 'live') renderLivePreview();
  else renderPrep();
}

/* ============ CALENDAR MODULE ============ */
const WEEKDAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// Suppresses the click-to-open handler right after a drag-and-drop reschedule, same
// pattern used for the Previz feed's drag-to-reorder (see `justDragged` above).
let justDraggedCal = false;

function shiftCalendarMonth(delta){
  let m = state.calendarMonth + delta;
  let y = state.calendarYear;
  if(m < 0){ m = 11; y -= 1; }
  else if(m > 11){ m = 0; y += 1; }
  state.calendarMonth = m;
  state.calendarYear = y;
  renderCalendarModule();
}

function calDayCellHtml(cell, postsByDate, todayStr){
  if(!cell.inMonth){
    return `<div class="cal-cell out-month"><div class="cal-daynum">${cell.dayNum}</div></div>`;
  }
  const posts = (postsByDate[cell.dateStr] || []).slice()
    .sort((a,b)=> (a.company_id||'').localeCompare(b.company_id||''));
  const isToday = cell.dateStr === todayStr;
  const maxShow = 3;
  const shown = posts.slice(0, maxShow);
  const overflow = posts.length - shown.length;

  const chips = shown.map(p=>{
    const company = companyById(p.company_id) || {};
    const thumb = firstThumbOf(p);
    const thumbHtml = thumb
      ? (thumb.video ? `<video src="${thumb.url}" muted></video>` : `<img src="${thumb.url}">`)
      : `<div class="cal-chip-noimg" style="background:${company.color||'#333'}">${escapeHtml(company.initials||'?')}</div>`;
    return `
      <div class="cal-chip js-cal-open" draggable="true" data-id="${p.id}" title="${escapeHtml(p.caption||'(no caption yet)')}">
        <div class="cal-chip-thumb">${thumbHtml}<span class="cal-chip-dot" style="background:${company.color||'#666'}"></span></div>
        <div class="cal-chip-text">
          <span class="mini-status status-${p.status}">${STATUS_LABEL[p.status]}</span>
          <span class="cal-chip-cap">${escapeHtml((p.caption||'(no caption)').slice(0,40))}</span>
        </div>
      </div>`;
  }).join('');
  const moreHtml = overflow > 0 ? `<div class="cal-more">+${overflow} more</div>` : '';

  return `
    <div class="cal-cell ${isToday?'today':''}" data-date="${cell.dateStr}">
      <div class="cal-daynum">${cell.dayNum}</div>
      <div class="cal-chips">${chips}${moreHtml}</div>
    </div>`;
}

function renderCalendarModule(){
  if(!state.loaded){
    $('#content').innerHTML = `<div class="empty-state">Loading…</div>`;
    return;
  }
  const content = $('#content');
  const y = state.calendarYear, m = state.calendarMonth;
  const monthLabel = new Date(y, m, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const todayStr = new Date().toISOString().slice(0,10);

  // Group every post (across all companies) by its scheduled date; anything without
  // a date goes in the "unscheduled" tray instead of being dropped silently.
  const postsByDate = {};
  const unscheduled = [];
  state.posts.forEach(p=>{
    if(p.scheduled_date){
      (postsByDate[p.scheduled_date] = postsByDate[p.scheduled_date] || []).push(p);
    } else {
      unscheduled.push(p);
    }
  });

  const firstOfMonth = new Date(y, m, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();

  const cells = [];
  for(let i=0;i<startWeekday;i++){
    cells.push({ dayNum: daysInPrevMonth - startWeekday + 1 + i, inMonth:false, dateStr:null });
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ dayNum: d, inMonth:true, dateStr });
  }
  let trailDay = 1;
  while(cells.length < 42){
    cells.push({ dayNum: trailDay++, inMonth:false, dateStr:null });
  }

  content.innerHTML = `
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="btn ghost small" id="calPrev">‹</button>
        <div class="cal-month-label">${monthLabel}</div>
        <button class="btn ghost small" id="calNext">›</button>
        <button class="btn ghost small" id="calToday">Today</button>
      </div>
      <div class="cal-legend">
        ${COMPANIES.map(c=>`<span class="cal-legend-item"><span class="sw" style="background:${c.color}"></span>${c.name}</span>`).join('')}
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">${WEEKDAY_LABELS.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
      <div class="cal-days">${cells.map(c=>calDayCellHtml(c, postsByDate, todayStr)).join('')}</div>
    </div>
    <div class="section-heading" style="margin-top:28px;">Unscheduled — ideas &amp; drafts</div>
    <div class="cal-unsched-grid" id="calUnsched"></div>
  `;

  $('#calPrev').addEventListener('click', ()=> shiftCalendarMonth(-1));
  $('#calNext').addEventListener('click', ()=> shiftCalendarMonth(1));
  $('#calToday').addEventListener('click', ()=>{
    const now = new Date();
    state.calendarMonth = now.getMonth();
    state.calendarYear = now.getFullYear();
    renderCalendarModule();
  });
  $all('.js-cal-open', content).forEach(el=>{
    el.addEventListener('click', ()=>{ if(justDraggedCal) return; openEditor(el.dataset.id); });
  });

  const unschedWrap = $('#calUnsched');
  if(unscheduled.length === 0){
    unschedWrap.innerHTML = `<div class="empty-state">Nothing unscheduled — every idea and draft already has a date, or there are no posts yet.</div>`;
  } else {
    unschedWrap.innerHTML = unscheduled.map(p=>{
      const company = companyById(p.company_id) || {};
      const thumb = firstThumbOf(p);
      const thumbHtml = thumb
        ? (thumb.video ? `<video src="${thumb.url}" muted></video>` : `<img src="${thumb.url}">`)
        : `<div class="no-media-ph" style="height:100%;">🖼</div>`;
      const platformLabel = PLATFORM_META[p.platform] ? PLATFORM_META[p.platform].label : p.platform;
      return `
        <div class="content-card cal-unsched-card js-cal-open" draggable="true" data-id="${p.id}">
          <div class="thumb-wrap thumb-16x9" style="position:relative;">
            ${thumbHtml}
            <span class="cal-chip-dot" style="position:absolute;top:6px;left:6px;width:9px;height:9px;background:${company.color||'#666'};"></span>
          </div>
          <div class="cc-body">
            <div class="cc-title">${escapeHtml((p.caption||'(no caption yet)').slice(0,80))}</div>
            <div class="cc-date">${escapeHtml(company.name||'')} · ${escapeHtml(platformLabel)}</div>
            <span class="mini-status status-${p.status}">${STATUS_LABEL[p.status]}</span>
          </div>
        </div>`;
    }).join('');
    $all('.js-cal-open', unschedWrap).forEach(el=>{
      el.addEventListener('click', ()=>{ if(justDraggedCal) return; openEditor(el.dataset.id); });
    });
  }

  bindCalendarDragDrop(content);
}

// Lets you drag an unscheduled idea/draft card (or an already-scheduled chip) straight
// onto a day cell to set/move its scheduled_date — no need to open the editor just to
// pick a date.
function bindCalendarDragDrop(root){
  $all('.cal-chip, .cal-unsched-card', root).forEach(el=>{
    el.addEventListener('dragstart', (e)=>{
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.id); }catch(err){}
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      justDraggedCal = true;
      setTimeout(()=>{ justDraggedCal = false; }, 50);
    });
  });
  $all('.cal-cell', root).forEach(cell=>{
    if(!cell.dataset.date) return; // out-of-month cells aren't valid drop targets
    cell.addEventListener('dragover', (e)=>{
      e.preventDefault();
      cell.classList.add('drag-over');
    });
    cell.addEventListener('dragleave', ()=>{
      cell.classList.remove('drag-over');
    });
    cell.addEventListener('drop', async (e)=>{
      e.preventDefault();
      cell.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if(!id) return;
      const post = state.posts.find(p=>p.id===id);
      if(!post) return;
      const newDate = cell.dataset.date;
      if(post.scheduled_date === newDate) return;
      try{
        const updated = await updatePost(id, { scheduled_date: newDate });
        Object.assign(post, updated);
        showToast('Moved to ' + fmtDate(newDate));
        renderCalendarModule();
      }catch(err){
        console.error(err);
        showToast('Failed to reschedule — try again.');
      }
    });
  });
}

let justDragged = false;

function bindDragReorder(grid){
  $all('.card-wrap', grid).forEach(card=>{
    card.addEventListener('dragstart', (e)=>{
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', card.dataset.id); }catch(err){}
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      persistCardOrder(grid);
      justDragged = true;
      setTimeout(()=>{ justDragged = false; }, 50);
    });
    card.addEventListener('dragover', (e)=>{
      e.preventDefault();
      const dragging = grid.querySelector('.dragging');
      if(!dragging || dragging === card) return;
      const rect = card.getBoundingClientRect();
      const midX = rect.left + rect.width/2;
      const midY = rect.top + rect.height/2;
      const after = e.clientY > midY || (Math.abs(e.clientY - midY) < rect.height*0.25 && e.clientX > midX);
      if(after) card.parentNode.insertBefore(dragging, card.nextSibling);
      else card.parentNode.insertBefore(dragging, card);
    });
  });
}

async function persistCardOrder(grid){
  const ids = $all('.card-wrap', grid).map(el=>el.dataset.id);
  const jobs = [];
  ids.forEach((id, idx)=>{
    const post = state.posts.find(p=>p.id===id);
    if(post && post.sort_order !== idx){
      post.sort_order = idx;
      jobs.push(updatePost(id, { sort_order: idx }).catch(err=>console.error(err)));
    }
  });
  if(jobs.length){
    await Promise.all(jobs);
    showToast('Order saved');
  }
}

function mediaItemsOf(post){
  return Array.isArray(post.media_items) ? post.media_items : [];
}

function activeMediaItem(post){
  const items = mediaItemsOf(post);
  if(items.length === 0) return null;
  const idx = Math.min(state.carouselIndex[post.id] || 0, items.length - 1);
  return items[idx];
}

function clampAspect(ratio, kind){
  if(!ratio || !isFinite(ratio) || ratio <= 0) ratio = 1;
  if(kind === 'ig' || kind === 'li'){
    return Math.max(0.8, Math.min(1.91, ratio));
  }
  return ratio;
}

// Auto-fit the mockup frame to the media's real orientation (portrait/square/landscape),
// clamped to what that platform actually allows. YouTube and vertical formats stay fixed.
function mediaAspectStyle(post, kind){
  if(kind !== 'ig' && kind !== 'li') return '';
  const item = activeMediaItem(post);
  const ratio = (item && item.ratio) ? item.ratio : 1;
  return `aspect-ratio:${clampAspect(ratio, kind)};`;
}

function renderCardWrap(post, company){
  const meta = PLATFORM_META[post.platform];
  let inner = '';
  if(meta.kind === 'ig') inner = renderIgCard(post, company);
  else if(meta.kind === 'yt') inner = renderYtCard(post, company);
  else if(meta.kind === 'li') inner = renderLiCard(post, company);
  else if(meta.kind === 'vert') inner = renderVertCard(post, company, meta.vertLabel);

  const items = mediaItemsOf(post);
  let mediaLabel = '— empty —';
  if(items.length === 1) mediaLabel = items[0].type === 'link' ? '🔗 link' : '📎 media';
  else if(items.length > 1) mediaLabel = `📎 ${items.length} slides`;

  const linkedBadge = post.group_id ? `<span title="Cross-posted with other platforms">🔗</span>` : '';

  return `
    <div class="card-wrap" data-id="${post.id}" draggable="true">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <span class="status-badge status-${post.status}">${STATUS_LABEL[post.status]}</span>
      ${inner}
      <div class="card-meta-line">
        <span>${post.scheduled_date ? 'Scheduled ' + fmtDate(post.scheduled_date) : 'No date set'} ${linkedBadge}</span>
        <span>${mediaLabel}</span>
      </div>
    </div>
  `;
}

function renderMediaSlides(post){
  const items = mediaItemsOf(post);
  if(items.length === 0){
    return `<div class="no-media-ph"><span class="plus">+</span>Add media</div>`;
  }
  const activeIdx = Math.min(state.carouselIndex[post.id] || 0, items.length - 1);
  const slides = items.map((it, i) => {
    let inner;
    if(it.type === 'link'){
      inner = `<div class="no-media-ph"><span class="plus">🔗</span>Linked file<br><span style="max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(it.url)}</span></div>`;
    } else if(it.media_type === 'video'){
      inner = `<video src="${it.url}" muted loop playsinline></video>`;
    } else {
      inner = `<img src="${it.url}" alt="">`;
    }
    return `<div class="media-slide ${i===activeIdx?'active':''}">${inner}</div>`;
  }).join('');
  const nav = items.length > 1 ? `
    <button type="button" class="car-nav prev" data-post="${post.id}" data-dir="-1">‹</button>
    <button type="button" class="car-nav next" data-post="${post.id}" data-dir="1">›</button>
    <div class="car-dots">${items.map((_,i)=>`<button type="button" class="car-dot ${i===activeIdx?'active':''}" data-post="${post.id}" data-idx="${i}"></button>`).join('')}</div>
  ` : '';
  return slides + nav;
}

function bindCarouselControls(root){
  $all('.car-nav', root).forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const postId = btn.dataset.post;
      const post = state.posts.find(p=>p.id===postId);
      const items = mediaItemsOf(post);
      const cur = state.carouselIndex[postId] || 0;
      const dir = parseInt(btn.dataset.dir, 10);
      state.carouselIndex[postId] = (cur + dir + items.length) % items.length;
      renderFeedOnly();
    });
  });
  $all('.car-dot', root).forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.carouselIndex[btn.dataset.post] = parseInt(btn.dataset.idx, 10);
      renderFeedOnly();
    });
  });
}

function renderFeedOnly(){
  const company = companyById(state.company);
  const posts = state.posts.filter(p =>
    p.company_id === state.company &&
    p.platform === state.platform &&
    (state.statusFilter === 'all' || p.status === state.statusFilter)
  );
  const grid = $('#feedGrid');
  if(!grid) return;
  grid.innerHTML = posts.map(p => renderCardWrap(p, company)).join('');
  $all('.card-wrap', grid).forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.car-nav') || e.target.closest('.car-dot') || justDragged) return;
      openEditor(el.dataset.id);
    });
  });
  bindCarouselControls(grid);
  bindDragReorder(grid);
}

function renderYtCard(post, company){
  const title = post.caption || '(untitled video)';
  const items = mediaItemsOf(post);
  let thumb;
  if(post.thumbnail_url){
    thumb = post.thumbnail_url.match(/\.(mp4|mov|webm)$/i) ? `<video src="${post.thumbnail_url}" muted></video>` : `<img src="${post.thumbnail_url}">`;
  } else if(items.length > 0){
    const first = items[0];
    if(first.type === 'link'){
      thumb = `<div class="no-media-ph"><span class="plus">🔗</span>Linked file</div>`;
    } else if(first.media_type === 'video'){
      thumb = `<video src="${first.url}" muted></video>`;
    } else {
      thumb = `<img src="${first.url}">`;
    }
  } else {
    thumb = `<div class="no-media-ph"><span class="plus">+</span>Add media</div>`;
  }
  return `
    <div class="yt-card">
      <div class="yt-thumb">${thumb}<span class="yt-duration">${post.platform==='youtube' && post.notes && post.notes.match(/\d+:\d+/) ? post.notes.match(/\d+:\d+/)[0] : 'VIDEO'}</span></div>
      <div class="yt-meta">
        <div class="avatar-circ" style="background:${company.color}">${company.initials}</div>
        <div>
          <div class="yt-title">${escapeHtml(title)}</div>
          <div class="yt-sub">${company.handle} · ${post.scheduled_date ? fmtDate(post.scheduled_date) : 'unscheduled'}</div>
        </div>
      </div>
    </div>
  `;
}

/* ============ EDITOR MODAL ============ */
function openEditor(id){
  const post = id ? state.posts.find(p=>p.id===id) : null;
  // Resolve against the post's own company (not necessarily the currently-selected
  // company tab) — needed so opening a post from the cross-company Calendar view

      <div class="field">
        <label>Media (add more than one for a carousel)</label>
